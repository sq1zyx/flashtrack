; ═══════════════════ FlashMacro — настройки ═══════════════════
; Имена клавиш как в AutoHotkey: a, g, 1, F8, Space, LShift, LCtrl, Tab,
; LButton, RButton, MButton, XButton1, XButton2, WheelUp, WheelDown.
; Задержки — в миллисекундах. После правки: трей → «Перезагрузить настройки».

[General]
; Пауза/включение всех макросов
SuspendKey=F8
; 1 — макросы работают только когда активно окно игры
OnlyInGame=1
GameExe=FortniteClient-Win64-Shipping.exe
; 1 — в левом верхнем углу видно, какие клавиши жмёт скрипт (для теста)
Debug=0
; Сколько держать клавишу/кнопку мыши при одиночном нажатии
KeyHoldMs=5
ClickHoldMs=5

[Game]
; ВАЖНО: укажи свои бинды из Fortnite
Edit=g
Select=LButton
Wall=z
Floor=x
Stairs=c
Cone=v
Crouch=LCtrl
Jump=Space
Sprint=LShift
Interact=e
Pickaxe=1
Slot1=2
Slot2=3
Slot3=4
Slot4=5
Slot5=6

; ─── Drag Edit: держишь триггер — выделяешь тайлы мышкой, отпустил — подтверждение
[DragEdit]
Enabled=1
Trigger=g
EnterDelay=10
; release — подтверждение отпусканием (в игре включи «Подтверждать изменения при отпускании»)
; key — повторное нажатие клавиши редактирования
ConfirmBy=release
ConfirmDelay=10

; ─── Instant Edit: одно нажатие = один редакт тайла под прицелом
[InstantEdit]
Enabled=0
Trigger=XButton2
EnterDelay=10
ConfirmBy=release
ConfirmDelay=10

; ─── Infinite Edit: держишь — спамит одиночные редакты
[InfiniteEdit]
Enabled=0
Trigger=XButton1
EnterDelay=10
ConfirmBy=release
ConfirmDelay=10
; Темп: StepDelay в мс, либо 0 — посчитать из FPS (FramesPerStep кадров на шаг)
StepDelay=0
FPS=240
FramesPerStep=3

; ─── Instant Build: нажал клавишу постройки — она сразу ставится
[InstantBuild]
Enabled=0
WallTrigger=z
FloorTrigger=x
StairsTrigger=c
ConeTrigger=v
PlaceDelay=10
; 1 — после постройки ЛКМ остаётся зажатой (непрерывная стройка),
; пока не нажмёшь редактирование, смену оружия или спринт
Continuous=0
StopKeys=1,2,3,4,5,6,LShift

; ─── Auto Sprint: после каждой постройки/редакта снова жмёт спринт
[AutoSprint]
Enabled=0
Delay=10

; ─── Pick-up: держишь — спамит «Взаимодействие»
[Pickup]
Enabled=0
Trigger=MButton
Delay=20

; ─── Прицел поверх игры (игра должна быть в «Оконный полноэкранный»)
[Crosshair]
Enabled=0
ShowOnStart=1
ToggleKey=F9
; dot, cross, crossdot, t, tdot
Style=crossdot
; цвет RRGGBB
Color=00FF00
Length=8
Thickness=2
Gap=4
DotSize=2
OffsetX=0
OffsetY=0

; ═══════════ Свои макросы и боевые пресеты: секции [Macro:Имя] ═══════════
; Mode: once — один раз; repeat — пока держишь; toggle — вкл/выкл нажатием
; Sequence через запятую: число = пауза, X = нажать, +X = зажать, -X = отпустить,
; {Имя} = бинд из [Game]. Speed — множитель скорости (2 = в два раза быстрее).
; Interval — пауза между повторами (repeat/toggle).

[Macro:Prefire]
Enabled=0
Trigger=F1
Mode=once
Sequence={Edit}, 10, {Select}, 10, {Edit}, 15, {Slot1}, 20, {Select}
Speed=1

[Macro:WallRetake]
Enabled=0
Trigger=F2
Mode=once
Sequence={Wall}, 10, {Select}, 15, {Slot1}
Speed=1

[Macro:SimpleEdit]
Enabled=0
Trigger=F3
Mode=once
Sequence={Edit}, 10, {Select}, 10, {Edit}
Speed=1

[Macro:CrouchPeek]
Enabled=0
Trigger=F4
Mode=once
Sequence={Crouch}, 120, {Crouch}
Speed=1

[Macro:Mantle]
Enabled=0
Trigger=F5
Mode=once
Sequence=+{Sprint}, 20, {Jump}, 60, -{Sprint}
Speed=1

[Macro:Custom1]
Enabled=0
Trigger=F6
Mode=repeat
Sequence={Interact}, 15
Interval=10
Speed=1
