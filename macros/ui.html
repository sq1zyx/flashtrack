<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>TweakMacro</title>
<!-- Меню TweakMacro. Работает во встроенном движке Windows (IE11), поэтому только ES5 и CSS без переменных:
     цвета подставляются из темы в шаблон стилей ниже (@токены@). -->
<script type="text/x-css" id="css-tpl">
html,body{margin:0;padding:0;height:100%;overflow:hidden;border:0}
body{background:@bg@;color:@text@;font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:13px;cursor:default;-ms-user-select:none;user-select:none;
  scrollbar-face-color:@key@;scrollbar-track-color:@bg@;scrollbar-arrow-color:@muted@;scrollbar-shadow-color:@bg@;scrollbar-highlight-color:@bg@;scrollbar-3dlight-color:@bg@;scrollbar-darkshadow-color:@bg@}
input{-ms-user-select:text;user-select:text}
input::-ms-clear{display:none}
svg{overflow:hidden}
.h3 .btn{letter-spacing:0}
#app{position:absolute;left:0;top:0;right:0;bottom:0;background:@bg@;background-image:radial-gradient(circle at 0% 0%,@a12@ 0%,@a0@ 38%),radial-gradient(circle at 100% 100%,@a8@ 0%,@a0@ 40%)}

/* ── верхняя панель ── */
#top{position:absolute;left:0;right:0;top:0;height:58px;display:flex;align-items:center;padding:0 12px 0 18px;box-sizing:border-box;border-bottom:1px solid @line@}
.logo{display:flex;align-items:center;width:196px}
.mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,@accent@ 0%,@accentDeep@ 100%);box-shadow:0 6px 18px @a40@;display:flex;align-items:center;justify-content:center;margin-right:11px}
.mark svg{width:17px;height:17px}
.wm{font-size:16px;font-weight:700;letter-spacing:.06em}
.wm b{color:@accent@;font-weight:700}
.pill{height:30px;line-height:30px;padding:0 16px;border-radius:15px;font-size:11px;font-weight:700;letter-spacing:.09em;cursor:pointer;background:@accent@;color:#fff;box-shadow:0 5px 18px @a40@;transition:background .2s,box-shadow .2s,color .2s}
.pill.off{background:@key@;color:@muted@;box-shadow:none}
.pill:hover{box-shadow:0 6px 22px @a50@}
.pill i{display:inline-block;width:7px;height:7px;border-radius:4px;background:#fff;margin-right:8px;vertical-align:1px}
.pill.off i{background:@muted@}
#top .kc{margin-left:8px}
.grow{flex:1}
.status{font-size:12px;color:@muted@;margin-right:14px;padding:6px 12px;border-radius:10px;background:@a0@}
.status i{display:inline-block;width:8px;height:8px;border-radius:4px;background:#22C55E;margin-right:7px;box-shadow:0 0 8px rgba(34,197,94,.7);vertical-align:0}
.status.off i{background:@muted@;box-shadow:none}
.wb{width:36px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:@muted@;cursor:pointer;margin-left:4px;transition:background .15s,color .15s}
.wb:hover{background:@key@;color:@text@}
.wb.x:hover{background:#E5484D;color:#fff}
.wb svg{width:15px;height:15px}

/* ── боковое меню ── */
/* меню-шторка: узкая полоса с иконками, при наведении выезжает с названиями поверх страницы */
#side{position:absolute;left:0;top:58px;bottom:0;width:66px;box-sizing:border-box;padding:14px 12px 12px;border-right:1px solid @line@;display:flex;flex-direction:column;
  overflow:hidden;z-index:30;background:@bg@;transition:width .28s cubic-bezier(.22,1,.36,1),box-shadow .28s}
#side:hover{width:226px;box-shadow:18px 0 40px rgba(0,0,0,.45)}
#side .nl,#side .navh span,#side .sver{opacity:0;transition:opacity .18s}
#side:hover .nl,#side:hover .navh span,#side:hover .sver{opacity:1;transition:opacity .25s .08s}
.navh{position:relative;height:12px;line-height:12px;white-space:nowrap;font-size:9.5px;font-weight:700;letter-spacing:.18em;color:@muted@;margin:9px 12px 4px;opacity:.75}
.navh:after{content:"";position:absolute;left:2px;top:6px;width:14px;height:1px;background:@line2@;transition:opacity .18s}
#side:hover .navh:after{opacity:0}
.navh:first-child{margin-top:0}
.sver{margin-top:auto;padding:8px 12px 0;font-size:10.5px;color:@muted@;white-space:nowrap}
.nav{position:relative;display:flex;align-items:center;white-space:nowrap;height:31px;padding:0 12px;border-radius:12px;color:@muted@;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:2px;transition:background .15s,color .15s}
.nav svg{width:18px;height:18px;margin-right:12px;flex:none}
.nav:hover{background:@key@;color:@text@}
.nav.sel{background:@a14@;color:@text@}
.nav.sel svg{color:@accent@}
.nav.sel:before{content:"";position:absolute;left:-12px;top:7px;width:4px;height:17px;border-radius:0 4px 4px 0;background:@accent@}
.sep{height:1px;background:@line@;margin:10px 10px}
.sfoot{margin-top:auto;padding:12px 14px;border-radius:14px;background:@panel@;border:1px solid @line@;font-size:11px;color:@muted@;line-height:1.55}
.sfoot b{color:@text@;font-weight:600}

/* ── контент ── */
#content{position:absolute;left:66px;right:-20px;top:58px;bottom:0;overflow-y:scroll;overflow-x:hidden;padding:20px 27px 24px 24px;box-sizing:border-box}
.page{display:none}
.page.show{display:block;animation:pin .22s ease-out}
.page.show.open{animation:openIn .2s cubic-bezier(.22,1,.36,1)}
@keyframes openIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes pin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ph{display:flex;align-items:center;margin-bottom:16px;padding:1px 0}
.ph h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.ph .sub{color:@muted@;font-size:12px;margin-left:16px;padding-left:16px;border-left:1px solid @line@}
.panel{background:@panel@;border:1px solid @line@;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.h3{font-size:10px;font-weight:700;letter-spacing:.16em;color:@muted@;display:flex;align-items:center;margin:16px 2px 10px}
.h3 .grow{flex:1}
.h3 .cnt{letter-spacing:0;font-weight:600;font-size:12px}
.h3 .cnt b{color:@text@}

/* ── легенда и клавиатура ── */
.legend{display:flex;margin-left:auto}
.lg{font-size:12px;color:@muted@;margin-left:18px;display:flex;align-items:center}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}
.dash{display:flex}
.kbd{padding:14px;margin-right:14px}
.kr{display:flex;margin-bottom:5px}
.kr:last-child{margin-bottom:0}
.k{height:29px;line-height:29px;border-radius:8px;background:@key@;color:@text@;font-size:11px;font-weight:600;text-align:center;margin-right:5px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.04);transition:background .12s,color .12s,box-shadow .12s}
.k:last-child{margin-right:0}
.k.sp{background:none;box-shadow:none}
.k.trig{background:@accent@;color:#fff;box-shadow:0 0 14px @a40@,inset 0 -2px 0 rgba(0,0,0,.25)}
.k.sus{background:#3B82F6;color:#fff;box-shadow:0 0 14px rgba(59,130,246,.45)}
.k.xh{background:#22C55E;color:#0B0B0B;box-shadow:0 0 14px rgba(34,197,94,.45)}
.k.press{background:#fff;color:#111;box-shadow:0 0 18px rgba(255,255,255,.55)}
.mouse{width:178px;padding:14px 10px;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.mouse svg{width:132px;height:200px}
.mk{fill:@key@;transition:fill .12s}
.mk.trig{fill:@accent@}
.mk.sus{fill:#3B82F6}
.mk.xh{fill:#22C55E}
.mk.press{fill:#fff}
.mbody{fill:@keyDark@}
.mtx{fill:@muted@;font-size:11px;font-weight:700;font-family:"Segoe UI",Arial,sans-serif}

/* ── карточки макросов ── */
.grid{display:flex;flex-wrap:wrap;margin-right:-12px}
.card{position:relative;width:calc(20% - 12px);height:98px;box-sizing:border-box;margin:0 12px 12px 0;padding:11px 13px;border-radius:16px;background:@card@;border:1px solid @line@;transition:transform .16s,box-shadow .16s,border-color .16s}
.card:hover{transform:translateY(-2px);border-color:@line2@;box-shadow:0 12px 26px rgba(0,0,0,.32)}
.card.on{border-color:@a50@;box-shadow:0 0 0 1px @a24@,0 10px 30px @a16@}
.ctop{display:flex;align-items:center;justify-content:space-between}
.cico{width:17px;height:17px;color:@muted@}
.card.on .cico{color:@accent@}
.nm{font-size:13px;font-weight:700;margin-top:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm:hover{color:@accent@}
.st{font-size:10px;font-weight:700;letter-spacing:.1em;color:@muted@}
.cbot{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.st.on{color:@accent@}
.add{border:1.5px dashed @line2@;background:@a0@;display:flex;align-items:center;justify-content:center;color:@muted@;font-weight:600;cursor:pointer}
.add:hover{border-color:@accent@;color:@text@;background:@a8@}
.add svg{width:16px;height:16px;margin-right:8px}

/* ── элементы управления ── */
.sw{display:inline-block;position:relative;width:40px;height:22px;border-radius:11px;background:@off@;cursor:pointer;vertical-align:middle;transition:background .18s,box-shadow .18s}
.sw i{position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:8px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4);transition:left .18s}
.sw.on{background:@accent@;box-shadow:0 0 12px @a40@}
.sw.on i{left:21px}
.kc{display:inline-block;min-width:24px;height:26px;line-height:26px;padding:0 10px;border-radius:8px;background:@key@;border:1px solid @line2@;font-size:11px;font-weight:700;text-align:center;cursor:pointer;transition:border-color .15s,background .15s,color .15s;white-space:nowrap}
.kc:hover{border-color:@accent@}
.kc.ro{cursor:pointer;color:@muted@;letter-spacing:.06em}
.kc.cap{background:@accent@;border-color:@accent@;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 @a50@}100%{box-shadow:0 0 0 9px @a0@}}
.seg{display:inline-flex;background:@key@;border-radius:11px;padding:3px;vertical-align:middle}
.seg b{display:inline-block;white-space:nowrap;height:26px;line-height:26px;padding:0 13px;border-radius:8px;color:@muted@;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
.seg b:hover{color:@text@}
.seg b.sel{background:@accent@;color:#fff;box-shadow:0 3px 12px @a35@}
.in{height:32px;box-sizing:border-box;padding:0 11px;border-radius:10px;border:1px solid @line2@;background:@key@;color:@text@;font-family:"Segoe UI",Tahoma,sans-serif;font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s;vertical-align:middle}
.in:focus{border-color:@accent@;box-shadow:0 0 0 3px @a16@}
.unit{color:@muted@;font-size:12px;margin-left:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 16px;border-radius:11px;background:@key@;border:1px solid @line2@;color:@text@;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{border-color:@accent@}
.btn svg{width:15px;height:15px;margin-right:8px}
.btn.pri{background:linear-gradient(135deg,@accent@ 0%,@accentDeep@ 100%);border-color:@accent@;color:#fff;box-shadow:0 6px 18px @a35@}
.btn.pri:hover{box-shadow:0 8px 24px @a50@}
.btn.danger{background:rgba(229,72,77,.1);border-color:rgba(229,72,77,.35);color:#F2777B}
.btn.danger:hover{background:rgba(229,72,77,.2);border-color:#E5484D}
.sws{display:inline-flex;align-items:center;vertical-align:middle}
.swt{display:inline-block;width:24px;height:24px;border-radius:12px;margin-right:9px;cursor:pointer;transition:box-shadow .15s,transform .15s}
.swt:hover{transform:scale(1.1)}
.swt.sel{box-shadow:0 0 0 2px @panel@,0 0 0 4px @text@}

/* ── формы ── */
.row{display:flex;align-items:center;padding:10px 12px;margin:0 -12px;border-radius:12px;border-top:1px solid @line@;transition:background .2s,border-color .2s}
.row:first-child,.h3+.row{border-top-color:transparent}
.row:hover{background:@key@;border-top-color:transparent}
.row:hover+.row{border-top-color:transparent}
.lb{flex:1;min-width:0;font-size:13px;padding-right:18px;line-height:1.35}
.lb b{display:block;font-weight:600}
.lb small{display:block;color:@muted@;font-size:11px;margin-top:3px;font-weight:400;line-height:1.4;max-height:31px;overflow:hidden}
.ct{flex:none;display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;max-width:62%}
.sgrp{padding:2px 22px 4px;margin-bottom:14px}
.two{display:flex;align-items:flex-start}
.two>.panel{min-width:0}
.narrow .ct{max-width:70%}
.list{width:214px;flex:none;padding:8px;margin-right:16px;box-sizing:border-box}
.li{display:flex;align-items:center;height:38px;padding:0 12px;border-radius:11px;color:@muted@;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
.li:hover{background:@key@;color:@text@}
.li.sel{background:@a14@;color:@text@}
.li span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:4px;background:@off@;flex:none}
.dot.on{background:@accent@;box-shadow:0 0 8px @a60@}
.form{flex:1;padding:20px 24px 12px;min-width:0}
.fh{display:flex;align-items:center}
.fh h2{margin:0;font-size:19px;font-weight:700}
.fh .st{margin:0 0 0 12px;padding:3px 9px;border-radius:7px;background:@key@}
.desc{color:@muted@;font-size:12.5px;line-height:1.55;margin:8px 0 10px;max-width:560px}
.help{margin:14px 0 8px;padding:12px 14px;border-radius:13px;background:@key@;color:@muted@;font-size:12px;line-height:1.6}
.help code{font-family:Consolas,monospace;color:@text@;background:@panel@;padding:1px 6px;border-radius:5px}
.empty{padding:40px 20px;text-align:center;color:@muted@;line-height:1.6}
.empty b{display:block;color:@text@;font-size:15px;margin-bottom:6px}

/* ── прицел ── */
.xprev{width:270px;flex:none;margin-left:16px;overflow:hidden}
.scene{position:relative;height:250px;border-radius:17px 17px 0 0;background:linear-gradient(180deg,#3E5A78 0%,#6D8FAF 46%,#5A6B4A 47%,#3B4A30 100%)}
.scene .xh{position:absolute;left:0;top:0}
.xcap{padding:12px 16px 14px;color:@muted@;font-size:12px;line-height:1.5}

/* ── настройки и лог ── */
.logp{width:270px;flex:none;margin-left:16px;padding:16px;box-sizing:border-box}
.logp h4{margin:0 0 10px;font-size:13px}
.log{height:560px;overflow:hidden;border-radius:12px;background:@key@;padding:10px 12px;box-sizing:border-box;font-family:Consolas,monospace;font-size:11px;line-height:1.6;color:@muted@;white-space:pre-wrap;word-wrap:break-word}
.foot{display:flex;margin-top:14px}
.foot .btn{margin-right:10px}

/* ── помощь ── */
.cards2{display:flex;flex-wrap:wrap;margin-right:-14px}
.hc{width:calc(50% - 14px);box-sizing:border-box;margin:0 14px 14px 0;padding:18px 20px}
.hc h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center}
.hc h3 svg{width:17px;height:17px;color:@accent@;margin-right:9px}
.hc ol,.hc ul{margin:0;padding-left:20px;color:@muted@;line-height:1.7;font-size:12.5px}
.hc li b{color:@text@;font-weight:600}
.warn{border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.07)}
.warn h3 svg{color:#F59E0B}

/* ── новое: инспектор клавиш, профили, переназначения ── */
.k.menu{background:#F59E0B;color:#111;box-shadow:0 0 14px rgba(245,158,11,.45)}
.mk.menu{fill:#F59E0B}
.k,.mk{cursor:pointer}
.k:hover{box-shadow:0 0 0 1px @line2@,inset 0 -2px 0 rgba(0,0,0,.28)}
.k.pick{box-shadow:0 0 0 2px #fff,0 0 16px rgba(255,255,255,.35)}
.mk.pick{stroke:#fff;stroke-width:2}
.cnt2{font-size:10px;color:@muted@;font-weight:600;margin-left:6px}
.card.fire{animation:fire .55s ease-out}
@keyframes fire{0%{box-shadow:0 0 0 0 @a60@}100%{box-shadow:0 0 0 14px @a0@}}
.pop{position:fixed;z-index:40;width:300px;max-height:440px;overflow-y:auto;padding:14px 12px;border-radius:16px;background:@tip@;border:1px solid @line2@;box-shadow:0 18px 44px rgba(0,0,0,.55);display:none;box-sizing:border-box}
.pop.show{display:block;animation:pin .16s ease-out}
/* свой скроллбар: системный скрыт, поверх контента — тонкая скруглённая полоса */
/* у #content системная полоса уезжает за правый край окна (right:-20px), у списков — скрыта */
.pop{-ms-overflow-style:none;scrollbar-width:none}
.pop::-webkit-scrollbar{display:none}
.sbar{position:fixed;width:12px;z-index:60;display:none}
.sbar i{position:absolute;right:3px;width:5px;border-radius:5px;background:@line2@;transition:width .12s,background .12s,right .12s}
.sbar:hover i{width:7px;right:2px;background:@muted@}
.sbar.drag i{width:7px;right:2px;background:@accent@}
.pop h4{margin:0 4px 6px;font-size:15px;display:flex;align-items:center}
.pop h4 .kc{margin-right:10px;cursor:default}
.pop .info{color:@muted@;font-size:12px;line-height:1.5;margin:0 4px 6px;white-space:pre-line}
.gh{font-size:10px;font-weight:700;letter-spacing:.14em;color:@muted@;margin:12px 6px 6px}
.opt{display:flex;align-items:center;height:32px;padding:0 10px;border-radius:9px;cursor:pointer;font-size:12.5px;transition:background .12s}
.opt:hover{background:@key@}
.opt span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .kc{flex:none;height:22px;line-height:22px;font-size:10px;min-width:20px;padding:0 7px}
.opt.cur{background:@a14@}
.opt.cur .kc{background:@accent@;border-color:@accent@;color:#fff}
.opt svg{width:14px;height:14px;margin-right:8px;color:@accent@}
.prof{display:flex;align-items:center;height:30px;padding:0 12px;margin-left:10px;border-radius:10px;background:@key@;border:1px solid @line2@;font-size:12px;font-weight:600;cursor:pointer;transition:border-color .15s}
.prof:hover{border-color:@accent@}
.prof small{color:@muted@;font-weight:600;margin-right:7px;font-size:11px}
.prof svg{width:13px;height:13px;margin-left:7px;color:@muted@}
.hue{display:inline-block;width:160px;height:16px;border-radius:8px;cursor:crosshair;vertical-align:middle;margin-right:12px;background:linear-gradient(90deg,#ff2d2d,#ffd000,#2de05a,#00d5ff,#3b5bff,#c03bff,#ff2d8a)}
.plist{flex:1;padding:10px}
.prow{display:flex;align-items:center;padding:12px 12px 12px 16px;border-radius:14px;margin-bottom:8px;border:1px solid @line@;background:@card@;transition:border-color .15s}
.prow:last-child{margin-bottom:0}
.prow.act{border-color:@a50@;box-shadow:0 0 0 1px @a24@}
.prow .pn{flex:1;min-width:0;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pn small{display:block;color:@muted@;font-weight:600;font-size:11px;margin-top:3px}
.ib{width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:@muted@;cursor:pointer;margin-left:2px;transition:background .15s,color .15s;flex:none}
.ib:hover{background:@key@;color:@text@}
.ib.del:hover{background:rgba(229,72,77,.15);color:#F2777B}
.ib.dis{visibility:hidden}
.ib svg{width:15px;height:15px}
.badge{font-size:10px;font-weight:700;letter-spacing:.1em;padding:5px 10px;border-radius:8px;background:@accent@;color:#fff;margin-right:6px;flex:none}
.btn.sm{height:30px;padding:0 12px;font-size:12px;border-radius:9px;flex:none}
.btn.sm svg{width:13px;height:13px;margin-right:6px}
.rbox{width:280px;flex:none;margin-left:16px;padding:18px;box-sizing:border-box}
.rbox h4{margin:0 0 6px;font-size:14px}
.rbox p{color:@muted@;font-size:12px;line-height:1.5;margin:0 0 14px}
.rbox .btn{display:flex;margin-bottom:8px;justify-content:flex-start}

.dlg h3{margin:0 0 8px;font-size:16px}

/* превью водяного знака */
.wmstage{position:relative;height:200px;border-radius:17px 17px 0 0;background:linear-gradient(180deg,#3E5A78 0%,#6D8FAF 46%,#5A6B4A 47%,#3B4A30 100%);overflow:hidden}

.wmp .on{background:#13281C;color:#4ADE80;padding:1px 8px}

.wmp .ck{color:#8C8C99;font-weight:500}
.wmp .kl{color:#fff}
/* помощники */
.ebs{display:flex;flex-wrap:wrap;margin:14px -6px 0}
.eb{width:calc(50% - 12px);margin:0 6px 12px;box-sizing:border-box;padding:12px 14px;border-radius:14px;background:@key@;border:1px solid @line@}
.ebr{display:flex;align-items:center}
.ebp{display:flex;margin:0 0 10px}
.ebp b{flex:1;text-align:center;padding:5px 0;margin-right:4px;border-radius:8px;font-size:11.5px;font-weight:600;color:@muted@;background:@panel@;border:1px solid @line@;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.ebp b:last-child{margin-right:0}
.ebp b:hover{color:@text@}
.ebp b.sel{background:@a14@;border-color:@accent@;color:@text@}
.eb .ef{flex:1;min-width:0;margin-right:12px}
.eb .ef .in{width:100%;margin-bottom:8px}
/* сетка как в редакте Fortnite: синие полупрозрачные клетки, выбранные — яркие */
.egw{position:relative;width:136px;height:136px;flex:none;display:flex;align-items:center;justify-content:center}
.eg{position:relative;display:flex;flex-wrap:wrap;width:130px;padding:2px;box-sizing:border-box;filter:drop-shadow(0 0 8px rgba(80,160,255,.35))}
/* клетки как в игре: синее стекло с мазками краски, тонкая белая обводка и щели между клетками */
.eg b{width:38px;height:38px;margin:2px;box-sizing:border-box;cursor:pointer;border:1px solid rgba(235,245,255,.85);
  background:linear-gradient(162deg,rgba(255,255,255,0) 0,rgba(255,255,255,0) 30%,rgba(170,215,255,.45) 31%,rgba(170,215,255,.45) 34%,rgba(255,255,255,0) 35%,rgba(255,255,255,0) 64%,rgba(150,205,255,.4) 65%,rgba(150,205,255,.4) 68%,rgba(255,255,255,0) 69%),
    repeating-linear-gradient(180deg,rgba(38,98,190,.62) 0,rgba(38,98,190,.62) 9px,rgba(52,140,240,.78) 9px,rgba(52,140,240,.78) 12px);
  transition:opacity .12s,box-shadow .12s,border-color .12s}
.eg b:hover{border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.7)}
/* выбранная клетка — её уберут: почти прозрачная, остаётся яркий контур */
.eg b.on{background:rgba(120,190,255,.12);border:1.5px solid #fff;box-shadow:0 0 10px rgba(120,200,255,.9),inset 0 0 8px rgba(160,215,255,.6)}
.eg.g2 b{width:57px;height:57px}
/* наклон как в игре: пол и конус видишь сверху, лестницу — под углом */
.eg.floor{transform:perspective(380px) rotateX(50deg)}
.eg.stairs{transform:perspective(320px) rotateX(38deg)}
.eg.stairs b{width:56px;height:62px}
.eg.cone{transform:perspective(380px) rotateX(46deg)}
.eg.cone:before{content:"";position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;background:linear-gradient(45deg,rgba(0,0,0,0) 49.3%,rgba(235,245,255,.7) 49.7%,rgba(235,245,255,.7) 50.3%,rgba(0,0,0,0) 50.7%),linear-gradient(-45deg,rgba(0,0,0,0) 49.3%,rgba(235,245,255,.7) 49.7%,rgba(235,245,255,.7) 50.3%,rgba(0,0,0,0) 50.7%)}
/* прицел редакта как в игре: «( · )» по центру экрана */
.exh{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;pointer-events:none;box-sizing:border-box;border-radius:50%;border:2px solid rgba(255,255,255,.95);border-top-color:transparent;border-bottom-color:transparent;filter:drop-shadow(0 0 2px rgba(0,0,0,.9))}
.exh:before{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:2px;background:#fff}
.exh:after{content:none}
/* что получится: стена, выделенные клетки — вырезаны */
.ep{display:flex;flex-wrap:wrap;width:54px;margin-left:12px;flex:none;border-radius:4px;overflow:hidden;background:linear-gradient(180deg,#5B86B3 0%,#8FB3D6 100%)}
.ep i{width:18px;height:18px;box-sizing:border-box;background:#A6774A;border:1px solid #7E5733}
.ep i.cut{background:none!important;border-color:transparent!important}
.ep.g2 i{width:27px;height:27px}
.ep.floor i{background:#8C6239}
.ep.stairs i{background:repeating-linear-gradient(180deg,#A6774A 0,#A6774A 4px,#7E5733 4px,#7E5733 6px)}
.ep.cone i{background:#9A6E45;border-color:#6E4C2C}
.kstat{display:flex;margin:0 -5px 12px}
.kstat div{flex:1;margin:0 5px;padding:12px 14px;border-radius:14px;background:@key@;border:1px solid @line@}
.kstat b{display:block;font-size:26px;font-weight:700;line-height:1.15}
.kstat span{display:block;color:@muted@;font-size:11px;margin-top:2px}
.kstat .hl{background:@a14@;border-color:@accent@}
.kstat .hl b{color:@accent@}
.pgrid{display:flex;flex-wrap:wrap;margin:10px -4px 0}
.pg{width:calc(25% - 8px);margin:0 4px 8px;box-sizing:border-box;padding:9px 12px;border-radius:12px;background:@key@;border:1px solid @line@}
.pg b{display:block;font-size:18px;font-weight:700}
.pg span{display:block;color:@muted@;font-size:11px}
.pg.best{border-color:#22C55E;background:rgba(34,197,94,.1)}
.pg.best b{color:#4ADE80}
</script>

ng to wait after confirming the edit before firing. If the shot doesn't go through, raise it to 40–60 ms.", "Сколько раз выстрелить после открытия редакта.": "How many times to fire after opening the edit.", "Пауза между выстрелами, если их несколько. Для дробовика — около 60 мс, для автомата можно меньше.": "Delay between shots if there are several. About 60 ms for a shotgun, less for an AR.", "После выстрела снова войти в редакт и сбросить его — проход закроется обратно.": "After the shot, enter edit again and reset it, closing the opening.", "Сколько ждать после выстрела перед сбросом редакта.": "How long to wait after the shot before resetting the edit.", "Клавиша «Сбросить редактирование» из настроек Fortnite (по умолчанию — правая кнопка мыши).": "The “Reset building edit” key from your Fortnite settings (right mouse button by default).", "Звук при вкл/выкл": "Sound on toggle", "Предлагать запуск от администратора": "Offer to run as administrator", "Если Fortnite запущен с правами администратора, а TweakMacro — нет, Windows не пропускает макросы в игру. Тогда программа один раз предложит перезапуститься с правами.": "If Fortnite runs as administrator and TweakMacro doesn't, Windows blocks macros from reaching the game. Then the app offers once to restart with admin rights.", "Короткий звук при включении и выключении макросов и прицела.": "A short sound when macros or the crosshair are turned on or off.", "После постройки или редакта макрос снова нажимает спринт, чтобы не терять скорость. Выбери, после каких действий это нужно.": "After a build or an edit the macro presses sprint again so you keep your speed. Pick which actions it follows.", "После стены": "After a wall", "После пола": "After a floor", "После лестницы": "After stairs", "После конуса": "After a cone", "После редакта": "After an edit", "Нажимать спринт после стены из Instant build.": "Press sprint after a wall from Instant build.", "Нажимать спринт после пола из Instant build.": "Press sprint after a floor from Instant build.", "Нажимать спринт после лестницы из Instant build.": "Press sprint after stairs from Instant build.", "Нажимать спринт после конуса из Instant build.": "Press sprint after a cone from Instant build.", "Нажимать спринт после Drag edit, Instant edit и Infinite edit.": "Press sprint after Drag edit, Instant edit and Infinite edit.", "Тренировка скорости и реакции": "Speed and reaction training", "Скорость кликов": "Click speed", "Реакция": "Reaction", "Кликай по полю как можно быстрее 5 секунд. Помогает разогреть руку перед катками.": "Click the field as fast as you can for 5 seconds. A good warm-up before matches.", "Кликни, дождись зелёного и жми сразу. Средняя реакция — около 250 мс.": "Click, wait for green and click right away. Average reaction is about 250 ms.", "Старт": "Start", "Кликни, чтобы начать": "Click to start", "Рекорд": "Best", "кл/с": "cps", "сек осталось": "s left", "Новый рекорд! Кликни, чтобы ещё раз": "New record! Click to go again", "Кликни, чтобы ещё раз": "Click to go again", "Жди…": "Wait…", "Кликни, как только поле станет зелёным": "Click as soon as the field turns green", "Жми!": "Click!", "Сейчас!": "Now!", "Рано!": "Too early!", "Дождись зелёного. Кликни, чтобы ещё раз": "Wait for green. Click to go again", "Тренажёр работает только в меню и ничего не отправляет в игру.": "The trainer works only in the menu and sends nothing to the game.", "Обмен и облако": "Sharing and cloud", "Ключ и личные настройки в код и облако не попадают.": "Your key and personal settings never go into codes or the cloud.", "Поделиться кодом": "Share as code", "Ввести код": "Enter a code", "Сохранить в облако": "Save to cloud", "Загрузить из облака": "Load from cloud", "Скопировать текущий профиль одним кодом — можно отправить другу.": "Copy the current profile as one code to send to a friend.", "Вставить код конфига от друга — он станет новым профилем.": "Paste a config code from a friend; it becomes a new profile.", "Сохранить теку рждение клавишей": "Confirm with a key", "Готово": "Done", "Режим окна в Fortnite — <b>«Оконный полноэкранный»</b>, иначе меню и прицел не будут видны.": "Set Fortnite to <b>“Windowed fullscreen”</b>, otherwise the menu and crosshair won't be visible.", "<b>PgDn</b> — включить или выключить все макросы, <b>Insert</b> — меню поверх игры.": "<b>PgDn</b> turns all macros on or off, <b>Insert</b> opens the menu over the game.", "Наведи курсор на любой элемент меню — появится подсказка.": "Hover over anything in the menu to see a hint.", "В углу экрана — водяной знак: <b>ON</b> значит, что макросы работают.": "The watermark in the corner shows <b>ON</b> when macros are working.", "Пропустить": "Skip", "Далее": "Next", "Начать": "Start", "Быстрая настройка": "Quick setup", "Открыть настройку": "Open setup", "Пройти шаги первого запуска ещё раз: бинды, выбор макросов, советы.<br>": "Go through the first-run steps again: binds, macro choice, tips.<br>", "Тренажёр: скорость кликов и реакция, с рекордами.": "Trainer: click speed and reaction, with records.", "ГРАФИКА FORTNITE": "FORTNITE GRAPHICS", "Максимум FPS": "Max FPS", "Соревновательный": "Competitive", "Режим производительности, всё на минимуме. Больше всего кадров на слабых и средних ПК.": "Performance mode, everything on minimum. The most frames on low and mid PCs.", "DirectX 11, низкие настройки, дальность прорисовки максимальная. Картинка чище, кадров чуть меньше.": "DirectX 11, low settings, max view distance. A cleaner picture, slightly fewer frames.", "Лимит FPS": "FPS limit", "Не менять": "Keep", "Папка настроек": "Settings folder", "Вернуть файл настроек Fortnite из резервной копии.": "Restore the Fortnite settings file from the backup.", "Открыть папку с GameUserSettings.ini.": "Open the folder with GameUserSettings.ini.", "Меняется файл GameUserSettings.ini. Перед первым изменением сохраняется копия. Закрой Fortnite перед применением — при выходе игра перезаписывает настройки.": "This edits GameUserSettings.ini. A copy is saved before the first change. Close Fortnite before applying: the game overwrites its settings on exit.", "Файл настроек не найден — запусти Fortnite один раз": "Settings file not found, start Fortnite once", "Fortnite запущен — закрой игру, чтобы применить": "Fortnite is running, close it to apply", "Настройки найдены": "Settings found", "Режим производительности": "Performance mode", "Сейчас:": "Now:", "лимит": "limit", "Есть резервная копия": "Backup saved", "Настройки графики Fortnite будут изменены. Старый файл сохранится в резервную копию — вернуть можно кнопкой «Вернуть как было». Fortnite должен быть закрыт.": "Fortnite graphics settings will be changed. The old file is backed up; use “Restore” to bring it back. Fortnite must be closed.", "Лимит применится вместе с пресетом": "The limit is applied together with a preset", "Пока держишь клавишу на бегу — персонаж раз за разом делает подкат и встаёт. Каждый подкат даёт рывок скорости, поэтому бежишь быстрее.": "While you hold the key on the run, your character slides and stands up again and again. Each slide gives a burst of speed, so you move faster.", "Присед в Fortnite": "Fortnite crouch", "Переключение": "Toggle", "Удержание": "Hold", "Длина подката": "Slide length", "Пауза между подкатами": "Pause between slides", "Выходить из подката прыжком": "Cancel the slide with a jump", "Как настроен присед в Fortnite. «Переключение» — нажал и сидишь, нажал ещё раз — встал. «Удержание» — сидишь, пока держишь клавишу.": "How crouch is set in Fortnite. “Toggle”: press to crouch, press again to stand. “Hold”: crouch while the key is held.", "Сколько длится один подкат. 250–350 мс — самый быстрый рывок.": "How long one slide lasts. 250–350 ms gives the fastest burst.", "Пауза после того, как встал, перед следующим подкатом.": "Pause after standing up before the next slide.", "Вставать из подката прыжком — так быстрее, но персонаж подпрыгивает.": "Stand up from the slide with a jump: faster, but your character hops.", "Клавиша меню только в Fortnite": "Menu key only in Fortnite", "Клавиша меню открывает меню только поверх Fortnite. В других программах она работает как обычно. Меню всегда можно открыть из трея.": "The menu key opens the menu only over Fortnite. In other apps it works as usual. You can always open the menu from the tray.", "Fortnite на мощной видеокарте": "Fortnite on the high-performance GPU", "Windows всегда запускает игру на производительной видеокарте. Важно для ноутбуков, где игра иногда попадает на встроенную графику и теряет половину кадров.": "Windows always runs the game on the high-performance GPU. Important for laptops, where the game sometimes lands on integrated graphics and loses half its frames.", "Приоритет игр в планировщике Windows": "Game priority in the Windows scheduler", "Windows отдаёт играм больше процессорного времени и приоритет видеокарты, а фоновым мультимедиа-задачам — меньше. Прирост небольшой, но стабильный.": "Windows gives games more CPU time and GPU priority, and background multimedia tasks less. A small but steady gain.", "Не сканировать папку Fortnite": "Don't scan the Fortnite folder", "Защитник Windows не проверяет файлы игры при каждой подгрузке — меньше подлагиваний, когда игра грузит карту и шейдеры. Остальной ПК защищён как обычно.": "Windows Defender doesn't scan game files every time they load: fewer hitches while the map and shaders load. The rest of the PC stays protected.", "Очистка памяти во время игры": "Memory cleaning while playing", "Если в игре остаётся меньше 1 ГБ свободной памяти, TweakMacro сбрасывает кэш Windows. Убирает микрофризы после долгой игры на ПК с 8–16 ГБ ОЗУ.": "If less than 1 GB of memory is free during a match, TweakMacro clears the Windows cache. Removes micro-stutters after long sessions on PCs with 8–16 GB RAM.", "Оверлеи поверх игры": "Overlays on top of the game", "Проверить": "Check", "Discord, NVIDIA, RivaTuner, OBS и другие программы, которые рисуют поверх Fortnite. Каждая о function syncTrainer() {

  var c = Number(cv('Trainer', 'BestCps', 0)), r = Number(cv('Trainer', 'BestReact', 0));
  $('bcps').innerHTML = c ? c.toFixed(1) + ' ' + t('кл/с') : '—';
  $('breact').innerHTML = r ? r + ' ' + t('мс') : '—';
}
function tzSet(id, big, small, cls) { var z = $(id); z.className = 'tz' + (cls ? ' ' + cls : ''); z.innerHTML = '<b>' + big + '</b><small>' + esc(t(small)) + '</small>'; }
function cpsDown(e) {
  var now = new Date().getTime();
  if (!TR.cps) {
    TR.cps = { n: 0, t0: now };
    TR.cps.timer = setInterval(function () {
      var el = (new Date().getTime() - TR.cps.t0) / 1000;
      if (el >= 5) { cpsEnd(); return; }
      tzSet('tzc', TR.cps.n, (5 - el).toFixed(1) + ' ' + t('сек осталось'), 'wait');
    }, 100);
  }
  TR.cps.n++;
  return false;
}
function cpsEnd() {
  clearInterval(TR.cps.timer);
  var cps = Math.round(TR.cps.n / 5 * 10) / 10, best = Number(cv('Trainer', 'BestCps', 0));
  TR.cps = null;
  tzSet('tzc', cps.toFixed(1) + ' ' + t('кл/с'), cps > best ? 'Новый рекорд! Кликни, чтобы ещё раз' : 'Кликни, чтобы ещё раз', cps > best ? 'go' : '');
  if (cps > best) call('setVal', 'Trainer', 'BestCps', String(cps));
}
function reactDown(e) {
  var R = TR.react;
  if (!R) {
    TR.react = { state: 'wait' };
    tzSet('tzr', t('Жди…'), 'Кликни, как только поле станет зелёным', 'wait');
    TR.react.timer = setTimeout(function () { TR.react.state = 'go'; TR.react.t0 = new Date().getTime(); tzSet('tzr', t('Жми!'), 'Сейчас!', 'go'); }, 1200 + Math.random() * 2300);
  } else if (R.state === 'wait') {
    clearTimeout(R.timer); TR.react = null;
    tzSet('tzr', t('Рано!'), 'Дождись зелёного. Кликни, чтобы ещё раз');
  } else {
    var ms = new Date().getTime() - R.t0, best = Number(cv('Trainer', 'BestReact', 0));
    TR.react = null;
    var rec = !best || ms < best;
    tzSet('tzr', ms + ' ' + t('мс'), rec ? 'Новый рекорд! Кликни, чтобы ещё раз' : 'Кликни, чтобы ещё раз', rec ? 'go' : '');
    if (rec) call('setVal', 'Trainer', 'BestReact', String(ms));
  }
  return false;
}

        [['Отмена', ''], ['Применить', 'pri', function () { call('gfxApply', gv, gfxLim); }]]);
      break;
    case 'gfxLim': gfxLim = el.getAttribute('data-v'); syncGfx(); if (gfxLim !== 'keep') toast(t('Лимит применится вместе с пресетом')); break;
    case 'gfxRevert': call('gfxRevert'); break;
    case 'gfxFolder': call('gfxFolder'); break;
    case 'shareCode': toast(t('Готовлю код…')); call('shareCode'); break;
    case 'importCode': modalInput('Код конфига', '', function (v) { if (v) call('importCode', v); }); break;
    case 'cloudSave': call('cloudSave'); break;
    case 'cloudLoad': call('cloudLoad'); break;
    case 'rewizard': wizOpen(); break;
    case 'dupProfile': call('dupProfile', name); break;
    case 'exportProfile': call('exportProfile', name); break;
    case 'renameProfile': modalInput('Переименовать профиль', name, function (v) { call('renameProfile', name, v); }); break;
    case 'deleteProfile':
      modal('Удалить профиль?', '«' + name + '» будет удалён вместе с его файлом.', [['Отмена', ''], ['Удалить', 'danger', function () { call('deleteProfile', name); }]]);
      break;
    case 'resetSec':
      modal('Сбросить настройки?', 'Настройки этого макроса вернутся к стандартным.', [['Отмена', ''], ['Сбросить', 'pri', function () { call('resetSec', sec); }]]);
      break;
    case 'resetGroup':
      var g = el.getAttribute('data-g'), what = { macros: 'Все встроенные макросы', binds: 'Бинды Fortnite', crosshair: 'Настройки прицела' }[g];
      modal('Сбросить к стандартным?', what + ' в текущем профиле вернутся к стандартным значениям.', [['Отмена', ''], ['Сбросить', 'pri', function () { call('resetGroup', g); }]]);
      break;
    case 'newRemap': call('newRemap'); break;
    case 'opt': optToggle(el); break;
    case 'optRecommended': toast(t('Применяю…')); call('optRecommended'); break;
    case 'optRevert':
      modal('Вернуть как было?', 'Все настройки Windows, которые включал TweakMacro, вернутся к значениям до изменений.', [['Отмена', ''], ['Вернуть', 'pri', function () { toast('Возвращаю…'); call('optRevert'); }]]);
      break;
    case 'clean': $('cleanres').innerHTML = t('Чищу…'); call('clean'); break;
    case 'procs': $('procres').innerHTML = t('Собираю список…'); call('procs'); break;
    case 'ping': call('pingRegions'); break;
    case 'piece': setPiece(el.getAttribute('data-n'), el.getAttribute('data-v')); break;
    case 'safeSelect': call('safeSelect'); break;
    case 'addKill': call('addKill'); break;
    case 'newMatch': call('newMatch'); break;
    case 'overlays':
      var ol = [];
      try { ol = JSON.parse(call('overlays') || '[]'); } catch (x) {}
      var oh = '';
      for (var q = 0; q < ol.length; q++) oh += '<div class="pr" style="height:auto;padding:8px 10px;display:block"><b>' + esc(ol[q].name) + '</b><div style="color:#8C8C99;font-size:11.5px;margin-top:2px">' + esc(ol[q].tip) + '</div></div>';
      put($('ovres'), oh || t('Оверлеев не найдено — всё чисто.'));
      break;
    case 'tune':
      modalInput('Твой FPS в Fortnite', String(cv('InfiniteEdit', 'FPS', 240)), function (v) { var n = parseInt(v, 10); if (n >= 30) call('tuneDelays', n); else toast(t('Введи число, например 240')); });
      break;
    case 'kill':
      var pid = el.getAttribute('data-pid');
      modal('Закрыть программу?', '«' + name + '» будет закрыта. Несохранённые данные в ней пропадут.', [['Отмена', ''], ['Закрыть', 'danger', function () { call('killProc', pid); }]]);
      break;
    case 'elevate': call('elevate'); break;
    case 'licAct':
      var kv = $('lickey') ? $('lickey').value : '';
      if (!kv.replace(/\s/g, '')) { toast(t('Вставь ключ из письма или со страницы после оплаты.')); break; }
      call('licActivate', kv);
      break;
    case 'licRemove': call('licRemove'); break;
    case 'admRefresh': toast(t('Обновляю…')); call('adminRefresh'); break;
    case 'admPlan':
      admPlan = el.getAttribute('data-v');
      var pb = $('admplan').getElementsByTagName('b');
      for (var q = 0; q < pb.length; q++) setCls(pb[q], 'sel', pb[q].getAttribute('data-v') === admPlan);
      break;
    case 'admCreate': call('adminAction', 'create', admPlan, $('admemail').value.replace(/^\s+|\s+$/g, '')); break;
    case 'admPick': $('admkey').value = el.getAttribute('data-v'); break;
    case 'admReset': case 'admRevoke':
      var ak = $('admkey').value.replace(/\s/g, '').toUpperCase();
      if (!ak) { toast(t('Вставь ключ.')); break; }
      if (a === 'admReset') call('adminAction', 'reset', ak);
      else modal('Отозвать ключ?', ak + ' перестанет работать сразу у владельца.', [['Отмена', ''], ['Отозвать', 'pri', function () { call('adminAction', 'revoke', ak); }]]);
      break;
    case 'licRecheck': toast(t('Проверяю ключ…')); call('licRecheck'); break;
    case 'buy': if (!call('openBuy', S.license && S.license.state === 'other_device' ? 'reset' : 'buy')) toast(t('Проверка подписки выключена: в программе не указан адрес сервера.')); break;
    case 'delRemap': call('deleteSec', sec); break;
    case 'nav': showPage(el.getAttribute('data-page')); break;
    case 'macro': case 'sub':
      if (isPresetOrBuiltin(sec)) { curMacro = sec; showPage('Macros'); } else { curCustom = sec; showPage('Custom'); }
      break;
    case 'cust': curCustom = sec; syncCustom(); update(); break;
    case 'toggle':
      var v = isOn(cv(sec, el.getAttribute('data-key'))) ? '0' : '1';
      setLocal(sec, el.getAttribute('data-key'), v); update();
      call('setVal', sec, el.getAttribute('data-key'), v);
      break;
    case 'seg':
      var holder = up(el, 'data-t'), hs = holder.getAttribute('data-sec'), hk = holder.getAttribute('data-key'), val = el.getAttribute('data-val');
      if (!hs) return;
      setLocal(hs, hk, val); update(); applyTheme();
      call('setVal', hs, hk, val);
      break;
    case 'key':
      if (!sec || capEl) return;
      capEl = el; setCls(el, 'cap', true); el.innerHTML = t('Нажми…');
      hideTip();
      call('capture', sec, el.getAttribute('data-key'));
      break;
    case 'newCustom':
      var r = call('newCustom');
      if (r) { curCustom = r; showPage('Custom'); }
      break;
    case 'delCustom':
      var cs = curCustom;
      if (!cs) return;
      modal('Удалить макрос?', '«' + cs.substr(6) + '» будет удалён без возможности восстановления.', [['Отмена', ''], ['Удалить', 'danger', function () { call('deleteCustom', cs); }]]);
      break;
    case 'susp': call('toggleMacros'); break;
    case 'import': call('importBinds'); break;
    case 'openCfg': call('openConfig'); break;
    case 'openDir': call('openFolder'); break;
    case 'quit': modal('Выйти из TweakMacro?', 'Макросы перестанут работать до следующего запуска.', [['Отмена', ''], ['Выйти', 'danger', function () { call('quit'); }]]); break;
    case 'min': call('minimize'); break;
    case 'hide': call('hide'); break;
  }
}
document.onclick = function (e) {
  e = e || window.event;
  var t = e.target || e.srcElement, el = up(t, 'data-act');
  if (!up(t, 'data-pop') && !(el && /^(cap|profmenu)$/.test(el.getAttribute('data-act')))) hidePops();
  if (el) act(el.getAttribute('data-act'), el, e);
};
document.onkeydown = function (e) {
  e = e || window.event;
  if (e.keyCode === 27) { hidePops(); setCls($('ov'), 'show', false); }
  if (e.keyCode === 13 && (e.target || e.srcElement) && (e.target || e.srcElement).id === 'lickey') { act('licAct', $('lickey'), e); return; }
  if (e.keyCode === 13 && hasCls($('ov'), 'show') && $('mi')) {
    var bs = $('dlg').querySelectorAll('[data-mb]'); if (bs.length) bs[bs.length - 1].click();
  }
};
function hsl(h, s, l) {
  var c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2, r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  function hx(v) { var t = Math.round((v + m) * 255).toString(16); return t.length < 2 ? '0' + t : t; }
  return (hx(r) + hx(g) + hx(b)).toUpperCase();
}
document.onmousedown = function (e) {
  e = e || window.event;
  hideTip();
  var t = e.target || e.srcElement;
  if ((e.button === 0 || e.button === 1) && tileDown(t)) { if (e.preventDefault) e.preventDefault(); return false; }
  if ((e.button === 0 || e.button === 1) && up(t, 'data-drag') && !up(t, 'data-act')) call('drag');
};
document.oncontextmenu = function () { return false; };
document.onselectstart = function (e) { e = e || window.event; var t = e.target || e.srcElement; return t.tagName === 'INPUT'; };

// Поля ввода: применяем с небольшой задержкой, пока человек печатает
function wireInputs() {
  var ins = document.getElementsByTagName('input');
  for (var i = 0; i < ins.length; i++) ins[i].oninput = onInput;
}
function onInput(e) {
  e = e || window.event;
  var el = e.target || e.srcElement;
  if (el.getAttribute('data-t') === 'name') {
    clearTimeout(timers.rename);
    timers.rename = setTimeout(function () {
      var r = call('renameCustom', curCustom, el.value);
      if (r) curCustom = r;
    }, 700);
    return;
  }
  var sec = el.getAttribute('data-sec'), key = el.getAttribute('data-key');
  if (!sec) return;
  setLocal(sec, key, el.value);
  if (sec === 'Crosshair') drawPreview();
  if (key === 'AccentColor' && /^[0-9A-Fa-f]{6}$/.test(el.value)) { setLocal('General', 'Theme', 'custom'); applyTheme(); call('setVal', 'General', 'Theme', 'custom'); }
  var id = sec + '|' + key;
  clearTimeout(timers[id]);
  timers[id] = setTimeout(function () { call('setVal', sec, key, el.value); }, 450);
}

// ───────────── подсказки при наведении ─────────────
var tipEl = null, tipT = 0, mx = 0, my = 0;
document.onmousemove = function (e) { e = e || window.event; mx = e.clientX; my = e.clientY; };
document.onmouseup = function () { tileUp(); };
document.onmouseover = function (e) {
  e = e || window.event;
  if (tileDrag) { tileOver(e.target || e.srcElement); return; }
  var t = e.target || e.srcElement, el = up(t, 'data-cap') || up(t, 'data-tip');
  if (el && !el.getAttribute('data-cap') && !el.getAttribute('data-tip')) el = null;
  if (el === tipEl) return;
  hideTip();
  tipEl = el;
  if (!el) return;
  tipT = setTimeout(showTip, 380);
};
function showTip() {
  if (!tipEl || capEl) return;
  var txt = tipEl.getAttribute('data-cap') ? capTip(tipEl.getAttribute('data-norm')) : tipEl.getAttribute('data-tip');
  if (!txt) return;
  var tip = $('tip');
  tip.innerHTML = esc(t(txt)).replace(/\n/g, '<br>');
  var w = tip.offsetWidth, h = tip.offsetHeight, W = document.documentElement.clientWidth, H = document.documentElement.clientHeight;
  var x = mx + 14, y = my + 18;
  if (x + w > W - 8) x = Math.max(8, mx - w - 10);
  if (y + h > H - 8) y = Math.max(8, my - h - 12);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
  setCls(tip, 'show', true);
}
function hideTip() { clearTimeout(tipT); setCls($('tip'), 'show', false); }
</script>
</body>
