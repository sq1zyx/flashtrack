<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>FlashMacro</title>
<!-- Меню FlashMacro. Работает во встроенном движке Windows (IE11), поэтому только ES5 и CSS без переменных:
     цвета подставляются из темы в шаблон стилей ниже (@токены@). -->
<script type="text/x-css" id="css-tpl">
html,body{margin:0;padding:0;height:100%;overflow:hidden;border:0}
body{background:@bg@;color:@text@;font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:13px;cursor:default;-ms-user-select:none;user-select:none;
  scrollbar-face-color:@key@;scrollbar-track-color:@bg@;scrollbar-arrow-color:@muted@;scrollbar-shadow-color:@bg@;scrollbar-highlight-color:@bg@;scrollbar-3dlight-color:@bg@;scrollbar-darkshadow-color:@bg@}
input{-ms-user-select:text;user-select:text}
input::-ms-clear{display:none}
svg{overflow:hidden}
#app{position:absolute;left:0;top:0;right:0;bottom:0;background:@bg@;background-image:radial-gradient(circle at 0% 0%,@a12@ 0%,@a0@ 38%),radial-gradient(circle at 100% 100%,@a8@ 0%,@a0@ 40%)}

/* ── верхняя панель ── */
#top{position:absolute;left:0;right:0;top:0;height:58px;display:flex;align-items:center;padding:0 12px 0 18px;box-sizing:border-box;border-bottom:1px solid @line@}
.logo{display:flex;align-items:center;width:196px}
.mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,@accent@ 0%,@accentDeep@ 100%);box-shadow:0 6px 18px @a40@;display:flex;align-items:center;justify-content:center;margin-right:11px}
.mark svg{width:17px;height:17px}
.wm{font-size:16px;font-weight:700;letter-spacing:.06em}
.wm b{color:@accent@;font-weight:700}
.pill{height:30px;line-height:30px;padding:0 16px;border-radius:15px;font-size:11px;font-weight:700;letter-spacing:.09em;cursor:pointer;background:@accent@;color:#fff;box-shadow:0 5px 18px @a40@;transition:background .2s,box-shadow .2s,color .2s}
.pill.off{background:@key@;color:@muted@;box-shadow:none}
.pill:hover{box-shadow:0 6px 22px @a50@}
.pill i{display:inline-block;width:7px;height:7px;border-radius:4px;background:#fff;margin-right:8px;vertical-align:1px}
.pill.off i{background:@muted@}
#top .kc{margin-left:8px}
.grow{flex:1}
.status{font-size:12px;color:@muted@;margin-right:14px;padding:6px 12px;border-radius:10px;background:@a0@}
.status i{display:inline-block;width:8px;height:8px;border-radius:4px;background:#22C55E;margin-right:7px;box-shadow:0 0 8px rgba(34,197,94,.7);vertical-align:0}
.status.off i{background:@muted@;box-shadow:none}
.wb{width:36px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:@muted@;cursor:pointer;margin-left:4px;transition:background .15s,color .15s}
.wb:hover{background:@key@;color:@text@}
.wb.x:hover{background:#E5484D;color:#fff}
.wb svg{width:15px;height:15px}

/* ── боковое меню ── */
#side{position:absolute;left:0;top:58px;bottom:0;width:214px;box-sizing:border-box;padding:18px 12px 14px;border-right:1px solid @line@;display:flex;flex-direction:column}
.navh{font-size:10px;font-weight:700;letter-spacing:.16em;color:@muted@;margin:0 12px 10px}
.nav{position:relative;display:flex;align-items:center;height:40px;padding:0 12px;border-radius:12px;color:@muted@;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:3px;transition:background .15s,color .15s}
.nav svg{width:18px;height:18px;margin-right:12px}
.nav:hover{background:@key@;color:@text@}
.nav.sel{background:@a14@;color:@text@}
.nav.sel svg{color:@accent@}
.nav.sel:before{content:"";position:absolute;left:-12px;top:11px;width:4px;height:18px;border-radius:0 4px 4px 0;background:@accent@}
.sep{height:1px;background:@line@;margin:10px 10px}
.sfoot{margin-top:auto;padding:12px 14px;border-radius:14px;background:@panel@;border:1px solid @line@;font-size:11px;color:@muted@;line-height:1.55}
.sfoot b{color:@text@;font-weight:600}

/* ── контент ── */
#content{position:absolute;left:214px;right:0;top:58px;bottom:0;overflow-y:auto;overflow-x:hidden;padding:20px 24px 24px;box-sizing:border-box}
.page{display:none}
.page.show{display:block;animation:pin .22s ease-out}
@keyframes pin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ph{display:flex;align-items:center;margin-bottom:16px;min-height:34px}
.ph h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.ph .sub{color:@muted@;font-size:12px;margin-left:16px;padding-left:16px;border-left:1px solid @line@}
.panel{background:@panel@;border:1px solid @line@;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.h3{font-size:10px;font-weight:700;letter-spacing:.16em;color:@muted@;display:flex;align-items:center;margin:16px 2px 10px}
.h3 .grow{flex:1}
.h3 .cnt{letter-spacing:0;font-weight:600;font-size:12px}
.h3 .cnt b{color:@text@}

/* ── легенда и клавиатура ── */
.legend{display:flex;margin-left:auto}
.lg{font-size:12px;color:@muted@;margin-left:18px;display:flex;align-items:center}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}
.dash{display:flex}
.kbd{padding:14px;margin-right:14px}
.kr{display:flex;margin-bottom:5px}
.kr:last-child{margin-bottom:0}
.k{height:29px;line-height:29px;border-radius:8px;background:@key@;color:@text@;font-size:11px;font-weight:600;text-align:center;margin-right:5px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.04);transition:background .12s,color .12s,box-shadow .12s}
.k:last-child{margin-right:0}
.k.sp{background:none;box-shadow:none}
.k.trig{background:@accent@;color:#fff;box-shadow:0 0 14px @a40@,inset 0 -2px 0 rgba(0,0,0,.25)}
.k.sus{background:#3B82F6;color:#fff;box-shadow:0 0 14px rgba(59,130,246,.45)}
.k.xh{background:#22C55E;color:#0B0B0B;box-shadow:0 0 14px rgba(34,197,94,.45)}
.k.press{background:#fff;color:#111;box-shadow:0 0 18px rgba(255,255,255,.55)}
.mouse{width:178px;padding:14px 10px;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.mouse svg{width:132px;height:200px}
.mk{fill:@key@;transition:fill .12s}
.mk.trig{fill:@accent@}
.mk.sus{fill:#3B82F6}
.mk.xh{fill:#22C55E}
.mk.press{fill:#fff}
.mbody{fill:@keyDark@}
.mtx{fill:@muted@;font-size:11px;font-weight:700;font-family:"Segoe UI",Arial,sans-serif}

/* ── карточки макросов ── */
.grid{display:flex;flex-wrap:wrap;margin-right:-12px}
.card{position:relative;width:calc(20% - 12px);height:98px;box-sizing:border-box;margin:0 12px 12px 0;padding:11px 13px;border-radius:16px;background:@card@;border:1px solid @line@;transition:transform .16s,box-shadow .16s,border-color .16s}
.card:hover{transform:translateY(-2px);border-color:@line2@;box-shadow:0 12px 26px rgba(0,0,0,.32)}
.card.on{border-color:@a50@;box-shadow:0 0 0 1px @a24@,0 10px 30px @a16@}
.ctop{display:flex;align-items:center;justify-content:space-between}
.cico{width:17px;height:17px;color:@muted@}
.card.on .cico{color:@accent@}
.nm{font-size:13px;font-weight:700;margin-top:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm:hover{color:@accent@}
.st{font-size:10px;font-weight:700;letter-spacing:.1em;color:@muted@}
.cbot{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.st.on{color:@accent@}
.add{border:1.5px dashed @line2@;background:@a0@;display:flex;align-items:center;justify-content:center;color:@muted@;font-weight:600;cursor:pointer}
.add:hover{border-color:@accent@;color:@text@;background:@a8@}
.add svg{width:16px;height:16px;margin-right:8px}

/* ── элементы управления ── */
.sw{display:inline-block;position:relative;width:40px;height:22px;border-radius:11px;background:@off@;cursor:pointer;vertical-align:middle;transition:background .18s,box-shadow .18s}
.sw i{position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:8px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4);transition:left .18s}
.sw.on{background:@accent@;box-shadow:0 0 12px @a40@}
.sw.on i{left:21px}
.kc{display:inline-block;min-width:24px;height:26px;line-height:26px;padding:0 10px;border-radius:8px;background:@key@;border:1px solid @line2@;font-size:11px;font-weight:700;text-align:center;cursor:pointer;transition:border-color .15s,background .15s,color .15s;white-space:nowrap}
.kc:hover{border-color:@accent@}
.kc.ro{cursor:pointer;color:@muted@;letter-spacing:.06em}
.kc.cap{background:@accent@;border-color:@accent@;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 @a50@}100%{box-shadow:0 0 0 9px @a0@}}
.seg{display:inline-flex;background:@key@;border-radius:11px;padding:3px;vertical-align:middle}
.seg b{display:inline-block;white-space:nowrap;height:26px;line-height:26px;padding:0 13px;border-radius:8px;color:@muted@;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
.seg b:hover{color:@text@}
.seg b.sel{background:@accent@;color:#fff;box-shadow:0 3px 12px @a35@}
.in{height:32px;box-sizing:border-box;padding:0 11px;border-radius:10px;border:1px solid @line2@;background:@key@;color:@text@;font-family:"Segoe UI",Tahoma,sans-serif;font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s;vertical-align:middle}
.in:focus{border-color:@accent@;box-shadow:0 0 0 3px @a16@}
.unit{color:@muted@;font-size:12px;margin-left:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 16px;border-radius:11px;background:@key@;border:1px solid @line2@;color:@text@;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{border-color:@accent@}
.btn svg{width:15px;height:15px;margin-right:8px}
.btn.pri{background:linear-gradient(135deg,@accent@ 0%,@accentDeep@ 100%);border-color:@accent@;color:#fff;box-shadow:0 6px 18px @a35@}
.btn.pri:hover{box-shadow:0 8px 24px @a50@}
.btn.danger{background:rgba(229,72,77,.1);border-color:rgba(229,72,77,.35);color:#F2777B}
.btn.danger:hover{background:rgba(229,72,77,.2);border-color:#E5484D}
.sws{display:inline-flex;align-items:center;vertical-align:middle}
.swt{display:inline-block;width:24px;height:24px;border-radius:12px;margin-right:9px;cursor:pointer;transition:box-shadow .15s,transform .15s}
.swt:hover{transform:scale(1.1)}
.swt.sel{box-shadow:0 0 0 2px @panel@,0 0 0 4px @text@}

/* ── формы ── */
.row{display:flex;align-items:center;min-height:50px;border-bottom:1px solid @line@}
.row:last-child{border-bottom:0}
.lb{width:250px;flex:none;font-size:13px;padding-right:16px;line-height:1.35}
.lb small{display:block;color:@muted@;font-size:11px;margin-top:2px}
.ct{flex:1;display:flex;align-items:center;flex-wrap:wrap}
.two{display:flex;align-items:flex-start}
.two>.panel{min-width:0}
.narrow .lb{width:170px}
.list{width:214px;flex:none;padding:8px;margin-right:16px;box-sizing:border-box}
.li{display:flex;align-items:center;height:38px;padding:0 12px;border-radius:11px;color:@muted@;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
.li:hover{background:@key@;color:@text@}
.li.sel{background:@a14@;color:@text@}
.li span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:4px;background:@off@;flex:none}
.dot.on{background:@accent@;box-shadow:0 0 8px @a60@}
.form{flex:1;padding:20px 24px 12px;min-width:0}
.fh{display:flex;align-items:center}
.fh h2{margin:0;font-size:19px;font-weight:700}
.fh .st{margin:0 0 0 12px;padding:3px 9px;border-radius:7px;background:@key@}
.desc{color:@muted@;font-size:12.5px;line-height:1.55;margin:8px 0 10px;max-width:560px}
.help{margin:14px 0 8px;padding:12px 14px;border-radius:13px;background:@key@;color:@muted@;font-size:12px;line-height:1.6}
.help code{font-family:Consolas,monospace;color:@text@;background:@panel@;padding:1px 6px;border-radius:5px}
.empty{padding:40px 20px;text-align:center;color:@muted@;line-height:1.6}
.empty b{display:block;color:@text@;font-size:15px;margin-bottom:6px}

/* ── прицел ── */
.xprev{width:270px;flex:none;margin-left:16px;overflow:hidden}
.scene{position:relative;height:250px;border-radius:17px 17px 0 0;background:linear-gradient(180deg,#3E5A78 0%,#6D8FAF 46%,#5A6B4A 47%,#3B4A30 100%)}
.scene .xh{position:absolute;left:0;top:0}
.xcap{padding:12px 16px 14px;color:@muted@;font-size:12px;line-height:1.5}

/* ── настройки и лог ── */
.logp{width:270px;flex:none;margin-left:16px;padding:16px;box-sizing:border-box}
.logp h4{margin:0 0 10px;font-size:13px}
.log{height:560px;overflow:hidden;border-radius:12px;background:@key@;padding:10px 12px;box-sizing:border-box;font-family:Consolas,monospace;font-size:11px;line-height:1.6;color:@muted@;white-space:pre-wrap;word-wrap:break-word}
.foot{display:flex;margin-top:14px}
.foot .btn{margin-right:10px}

/* ── помощь ── */
.cards2{display:flex;flex-wrap:wrap;margin-right:-14px}
.hc{width:calc(50% - 14px);box-sizing:border-box;margin:0 14px 14px 0;padding:18px 20px}
.hc h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center}
.hc h3 svg{width:17px;height:17px;color:@accent@;margin-right:9px}
.hc ol,.hc ul{margin:0;padding-left:20px;color:@muted@;line-height:1.7;font-size:12.5px}
.hc li b{color:@text@;font-weight:600}
.warn{border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.07)}
.warn h3 svg{color:#F59E0B}

/* ── новое: инспектор клавиш, профили, переназначения ── */
.k.menu{background:#F59E0B;color:#111;box-shadow:0 0 14px rgba(245,158,11,.45)}
.mk.menu{fill:#F59E0B}
.k,.mk{cursor:pointer}
.k:hover{box-shadow:0 0 0 1px @line2@,inset 0 -2px 0 rgba(0,0,0,.28)}
.k.pick{box-shadow:0 0 0 2px #fff,0 0 16px rgba(255,255,255,.35)}
.mk.pick{stroke:#fff;stroke-width:2}
.cnt2{font-size:10px;color:@muted@;font-weight:600;margin-left:6px}
.card.fire{animation:fire .55s ease-out}
@keyframes fire{0%{box-shadow:0 0 0 0 @a60@}100%{box-shadow:0 0 0 14px @a0@}}
.pop{position:fixed;z-index:40;width:300px;max-height:440px;overflow-y:auto;padding:14px 12px;border-radius:16px;background:@tip@;border:1px solid @line2@;box-shadow:0 18px 44px rgba(0,0,0,.55);display:none;box-sizing:border-box}
.pop.show{display:block;animation:pin .16s ease-out}
.pop h4{margin:0 4px 6px;font-size:15px;display:flex;align-items:center}
.pop h4 .kc{margin-right:10px;cursor:default}
.pop .info{color:@muted@;font-size:12px;line-height:1.5;margin:0 4px 6px;white-space:pre-line}
.gh{font-size:10px;font-weight:700;letter-spacing:.14em;color:@muted@;margin:12px 6px 6px}
.opt{display:flex;align-items:center;height:32px;padding:0 10px;border-radius:9px;cursor:pointer;font-size:12.5px;transition:background .12s}
.opt:hover{background:@key@}
.opt span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .kc{flex:none;height:22px;line-height:22px;font-size:10px;min-width:20px;padding:0 7px}
.opt.cur{background:@a14@}
.opt.cur .kc{background:@accent@;border-color:@accent@;color:#fff}
.opt svg{width:14px;height:14px;margin-right:8px;color:@accent@}
.prof{display:flex;align-items:center;height:30px;padding:0 12px;margin-left:10px;border-radius:10px;background:@key@;border:1px solid @line2@;font-size:12px;font-weight:600;cursor:pointer;transition:border-color .15s}
.prof:hover{border-color:@accent@}
.prof small{color:@muted@;font-weight:600;margin-right:7px;font-size:11px}
.prof svg{width:13px;height:13px;margin-left:7px;color:@muted@}
.hue{display:inline-block;width:160px;height:16px;border-radius:8px;cursor:crosshair;vertical-align:middle;margin-right:12px;background:linear-gradient(90deg,#ff2d2d,#ffd000,#2de05a,#00d5ff,#3b5bff,#c03bff,#ff2d8a)}
.plist{flex:1;padding:10px}
.prow{display:flex;align-items:center;padding:12px 12px 12px 16px;border-radius:14px;margin-bottom:8px;border:1px solid @line@;background:@card@;transition:border-color .15s}
.prow:last-child{margin-bottom:0}
.prow.act{border-color:@a50@;box-shadow:0 0 0 1px @a24@}
.prow .pn{flex:1;min-width:0;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pn small{display:block;color:@muted@;font-weight:600;font-size:11px;margin-top:3px}
.ib{width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:@muted@;cursor:pointer;margin-left:2px;transition:background .15s,color .15s;flex:none}
.ib:hover{background:@key@;color:@text@}
.ib.del:hover{background:rgba(229,72,77,.15);color:#F2777B}
.ib.dis{visibility:hidden}
.ib svg{width:15px;height:15px}
.badge{font-size:10px;font-weight:700;letter-spacing:.1em;padding:5px 10px;border-radius:8px;background:@accent@;color:#fff;margin-right:6px;flex:none}
.btn.sm{height:30px;padding:0 12px;font-size:12px;border-radius:9px;flex:none}
.btn.sm svg{width:13px;height:13px;margin-right:6px}
.rbox{width:280px;flex:none;margin-left:16px;padding:18px;box-sizing:border-box}
.rbox h4{margin:0 0 6px;font-size:14px}
.rbox p{color:@muted@;font-size:12px;line-height:1.5;margin:0 0 14px}
.rbox .btn{display:flex;margin-bottom:8px;justify-content:flex-start}
.rrow{display:flex;align-items:center;min-height:56px;border-bottom:1px solid @line@}
.rrow:last-child{border-bottom:0}
.rrow .arrow{color:@muted@;margin:0 14px;display:flex}
.rrow .arrow svg{width:18px;height:18px}
.rrow .rl{color:@muted@;font-size:11px;margin-right:10px}
.fh .btn{margin-left:auto}
.dlg .in{width:100%;margin:0 0 16px}
.xs{display:inline-flex;flex-wrap:wrap}
.xs b{display:inline-flex;align-items:center;justify-content:center;width:38px;height:34px;border-radius:9px;background:@key@;margin:0 6px 6px 0;cursor:pointer;border:1px solid @line@;transition:border-color .15s,background .15s}
.xs b:hover{border-color:@line2@}
.xs b.sel{border-color:@accent@;background:@a14@}
.xs svg{width:20px;height:20px}
.ph .btn{margin-left:10px}

/* ── подсказка, уведомление, окно ── */
.tip{position:fixed;left:0;top:0;max-width:290px;padding:10px 13px;border-radius:12px;background:@tip@;border:1px solid @line2@;color:@text@;font-size:12px;line-height:1.5;box-shadow:0 14px 34px rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .14s;pointer-events:none;z-index:50}
.tip.show{opacity:1;visibility:visible}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);padding:11px 18px;border-radius:14px;background:@tip@;border:1px solid @line2@;font-weight:600;box-shadow:0 14px 34px rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .2s,transform .2s;z-index:60;white-space:nowrap}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.toast i{display:inline-block;width:8px;height:8px;border-radius:4px;background:@accent@;margin-right:10px;box-shadow:0 0 8px @a60@}
.ov{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:70}
.ov.show{display:flex}
.dlg{width:400px;padding:22px 24px 18px;border-radius:20px;background:@panel@;border:1px solid @line2@;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:pin .2s ease-out}
.dlg h3{margin:0 0 8px;font-size:16px}

  $('pg-Support').innerHTML = head('Support', 'Помощь и советы') + '<div class="cards2">' +
    card('Dashboard', 'Как начать', ['<b>Keybinds</b> — укажи те же клавиши, что в настройках Fortnite.', '<b>Dashboard</b> — включи нужные макросы тумблерами.',
      '<b>Macros</b> — задержки, режим подтверждения, FPS.', '<b>Custom</b> — свои макросы из любых нажатий.', '<b>Crosshair</b> — свой прицел поверх игры.'], '', 'ol') +
    card('game', 'Настройки Fortnite', ['«Подтверждать редактирование при отпускании» — <b>ВКЛ</b> (или включи Competitive).', '«Турбо-строительство» — <b>ВКЛ</b> для непрерывной стройки.',
      'Режим окна — <b>«Оконный полноэкранный»</b>, чтобы был виден прицел.']) +
    card('Support', 'Если макрос не срабатывает', ['Увеличь задержки до 15–20 мс — при низком FPS игра не успевает за быстрыми нажатиями.', 'Запусти FlashMacro от имени администратора.',
      'Проверь в Settings, что «Процесс игры» совпадает с процессом в Диспетчере задач.', 'Для проверки без игры выключи «Работать только в окне Fortnite» и включи «Лог нажатий».']) +
    card('alert', 'Важно', ['Крестик сворачивает FlashMacro в трей — макросы продолжают работать.', 'Полный выход — через трей или Settings.',
      'Epic запрещает макросы в турнирах и соревновательных режимах.'], 'warn') + '</div>';
}

function build() {
  applyTheme();
  buildSide(); buildDashboard(); buildKeybinds(); buildMacros(); buildCustom(); buildRemap(); buildCrosshair(); buildConfigs(); buildSettings(); buildSupport();
  $('profchev').innerHTML = ico('chev');
  $('pill').setAttribute('data-tip', 'Включает или выключает все макросы сразу. Справа — горячая клавиша для этого (работает и в игре).');
  $('suskey').setAttribute('data-tip', hint('General', 'SuspendKey'));
  wireInputs();
  showPage(page);
}

// ───────────── обновление из состояния ─────────────
function update() {
  if (!S) return;
  var sus = S.suspended;
  setCls($('pill'), 'off', sus); $('pillt').innerHTML = sus ? 'MACROS OFF' : 'MACROS ON';
  setCls($('status'), 'off', sus); $('statust').innerHTML = sus ? 'На паузе' : 'Макросы активны';
  var els = document.querySelectorAll('[data-t]');
  for (var i = 0; i < els.length; i++) {
    var el = els[i], t = el.getAttribute('data-t'), sec = el.getAttribute('data-sec'), key = el.getAttribute('data-key');
    if (sec === '' || sec === null || t === 'name') continue;
    var v = cv(sec, key);
    switch (t) {
      case 'toggle': case 'card': case 'dot': setCls(el, 'on', isOn(v)); break;
      case 'state': el.innerHTML = isOn(v) ? 'ON' : 'OFF'; setCls(el, 'on', isOn(v)); break;
      case 'key': if (el !== capEl) el.innerHTML = esc(keyLabel(v)); break;
      case 'input': if (document.activeElement !== el && el.value !== v) el.value = v; break;
      case 'seg': case 'swatch':
        var bs = el.getElementsByTagName(t === 'seg' ? 'b' : 'i');
        for (var j = 0; j < bs.length; j++) setCls(bs[j], 'sel', lc(bs[j].getAttribute('data-val')) === lc(v));
        break;
    }
  }
  var acc = document.querySelectorAll('.lg i.acc');
  for (var a = 0; a < acc.length; a++) acc[a].style.background = '#' + accentHex();
  $('cnt').innerHTML = '<b>' + S.active + '</b> active · ' + S.total + ' total';
  var cw = $('cusw'); if (cw) cw.style.background = '#' + (/^[0-9A-Fa-f]{6}$/.test(cv('General', 'AccentColor')) ? cv('General', 'AccentColor') : 'E11D2E');
  updateStats();
  caps();
  drawPreview();
}
function caps() {
  var els = document.querySelectorAll('[data-norm]');
  for (var i = 0; i < els.length; i++) {
    var el = els[i], n = el.getAttribute('data-norm'), st = pressed[n] ? 'press' : ((S && S.caps[n]) || '');
    var base = el.tagName.toLowerCase() === 'div' ? 'k' : 'mk';
    var want = base + (st ? ' ' + st : '') + (n === pickNorm ? ' pick' : '');
    if (el.getAttribute('class') !== want) el.setAttribute('class', want);
  }
}
function capTip(n) {
  var s = '';
  if (S) {
    for (var k in S.used) if (k === n) s += 'Запускает: ' + S.used[k] + '\n';
    for (var b in S.binds) if (b === n) s += 'Бинд Fortnite: ' + S.binds[b] + '\n';
  }
  return s ? s.replace(/\n$/, '') : 'Клавиша не используется макросами';
}

// Свои макросы: список и форма, привязанная к выбранному
function syncCustom() {
  var list = S.custom, key = list.join('|');
  var ok = false;
  for (var i = 0; i < list.length; i++) if (list[i] === curCustom) ok = true;
  if (!ok) curCustom = list.length ? list[0] : '';
  if (key !== customKey) {
    customKey = key;
    var h = '';
    for (var j = 0; j < list.length; j++)
      h += '<div class="li" data-act="cust" data-sec="' + esc(list[j]) + '"><span>' + esc(list[j].substr(6)) + '</span><i class="dot" data-t="dot" data-sec="' + esc(list[j]) + '" data-key="Enabled"></i></div>';
    $('clist').innerHTML = h;
  }
  var items = $('clist').getElementsByTagName('div');
  for (var n = 0; n < items.length; n++) setCls(items[n], 'sel', items[n].getAttribute('data-sec') === curCustom);
  var cf = document.querySelectorAll('#cform [data-sec]');
  for (var m = 0; m < cf.length; m++) cf[m].setAttribute('data-sec', curCustom);
  $('cform').style.display = curCustom ? 'block' : 'none';
  $('cempty').style.display = curCustom ? 'none' : 'block';
  var nm = $('cname');
  if (document.activeElement !== nm) nm.value = curCustom.substr(6);
}

// Превью прицела (те же фигуры, что рисует оверлей)
function num(k, d) { var v = parseFloat(cv('Crosshair', k, d)); return isNaN(v) ? d : v; }
function drawPreview() {
  var sc = $('scene'); if (!sc || page !== 'Crosshair') return;
  var st = lc(cv('Crosshair', 'Style', 'crossdot')), len = Math.max(1, Math.round(num('Length', 8))), th = Math.max(1, Math.round(num('Thickness', 2)));
  var gap = Math.max(0, Math.round(num('Gap', 4))), dot = Math.max(1, Math.round(num('DotSize', 2))), rad = Math.max(2, Math.round(num('Radius', 9)));
  var op = Math.max(5, Math.min(100, num('Opacity', 100))) / 100, col = cv('Crosshair', 'Color', '00FF00'), ocol = cv('Crosshair', 'OutlineColor', '000000');
  if (!/^[0-9A-Fa-f]{6}$/.test(col)) col = '00FF00';
  if (!/^[0-9A-Fa-f]{6}$/.test(ocol)) ocol = '000000';
  var o = Math.floor(th / 2), odd = th & 1, rects = [];
  if (/^(cross|crossdot|t|tdot|crosscircle)$/.test(st)) {
    rects.push([-gap - len, -o, len, th], [gap + odd, -o, len, th], [-o, gap + odd, th, len]);
    if (!/^t/.test(st)) rects.push([-o, -gap - len, th, len]);
  }
  var hasDot = /dot$/.test(st), ring = /circle/.test(st);
  var W = sc.offsetWidth, H = sc.offsetHeight, cx = Math.floor(W / 2), cy = Math.floor(H / 2);
  function pass(c, e) {
    var g = '';
    for (var i = 0; i < rects.length; i++)
      g += '<rect shape-rendering="crispEdges" x="' + (cx + rects[i][0] - e) + '" y="' + (cy + rects[i][1] - e) + '" width="' + (rects[i][2] + 2 * e) + '" height="' + (rects[i][3] + 2 * e) + '" fill="#' + c + '"/>';
    if (hasDot) g += '<circle cx="' + (cx + .5) + '" cy="' + (cy + .5) + '" r="' + (dot / 2 + e) + '" fill="#' + c + '"/>';
    if (ring) g += '<circle cx="' + (cx + .5) + '" cy="' + (cy + .5) + '" r="' + rad + '" fill="none" stroke="#' + c + '" stroke-width="' + (th + 2 * e) + '"/>';
    return g;
  }
  sc.innerHTML = '<svg width="' + W + '" height="' + H + '" style="position:absolute;left:0;top:0"><g opacity="' + op + '">' +
    (isOn(cv('Crosshair', 'Outline')) ? pass(ocol, 1) : '') + pass(col, 0) + '</g></svg>';
}

function updateStats() {
  var els = document.querySelectorAll('[data-stat]');
  for (var i = 0; i < els.length; i++) {
    var n = S.stats ? S.stats[els[i].getAttribute('data-stat')] : 0;
    els[i].innerHTML = n ? '· ' + n + '×' : '';
  }
}
function stats(json) {
  var ns = JSON.parse(json), old = S.stats || {};
  for (var k in ns) if (ns[k] !== old[k]) fire(k);
  S.stats = ns;
  updateStats();
}
function fire(sec) {
  var els = document.querySelectorAll('.card[data-t="card"]');
  for (var i = 0; i < els.length; i++) if (els[i].getAttribute('data-sec') === sec) {
    var el = els[i];
    setCls(el, 'fire', false);
    void el.offsetWidth;
    setCls(el, 'fire', true);
    (function (e) { setTimeout(function () { setCls(e, 'fire', false); }, 600); })(el);
  }
}

// ───────────── вызовы из AutoHotkey ─────────────
function init(meta) { M = JSON.parse(meta); build(); }
function render(state) {
  S = JSON.parse(state);
  applyTheme(); syncCustom(); syncRemaps(); syncProfiles(); update();
  if (pickNorm && hasCls($('kpop'), 'show')) { var el = findCap(pickNorm); if (el) openKey(el); }
  if (S.log !== undefined) setLog(S.log);
}
function flash(list) {
  pressed = {};
  var a = list ? String(list).split(',') : [];
  for (var i = 0; i < a.length; i++) if (a[i]) pressed[a[i]] = 1;
  caps();
}
function setLog(t) { var l = $('log'); if (l && t) l.innerText = t; }
function captureDone() { if (capEl) setCls(capEl, 'cap', false); capEl = null; update(); }
var toastT = 0;
function toast(msg) {
  var t = $('toast');
  t.innerHTML = '<i></i>' + esc(msg).replace(/\n/g, ' · ');
  setCls(t, 'show', true);
  clearTimeout(toastT);
  toastT = setTimeout(function () { setCls(t, 'show', false); }, 1900);
}
function importAsk(json) {
  var f = JSON.parse(json), s = '';
  for (var k in f) s += k + '  →  ' + keyLabel(f[k]) + '\n';
  modal('Найдены бинды', s + '\nПрименить их?', [['Отмена', ''], ['Применить', 'pri', function () { call('applyImport'); }]]);
}
function importNone(msg) { modal('Импорт из Fortnite', msg, [['Понятно', 'pri']]); }

// ───────────── окно подтверждения ─────────────
function modal(title, text, btns, input) {
  var h = '<h3>' + esc(title) + '</h3>' + (text ? '<p>' + esc(text) + '</p>' : '') + (input !== undefined ? '<input class="in" id="mi" value="' + esc(input) + '">' : '') + '<div class="acts">';
  for (var i = 0; i < btns.length; i++) h += '<span class="btn ' + btns[i][1] + '" data-mb="' + i + '">' + esc(btns[i][0]) + '</span>';
  $('dlg').innerHTML = h + '</div>';
  setCls($('ov'), 'show', true);
  $('dlg').onclick = function (e) {
    e = e || window.event;
    var b = up(e.target || e.srcElement, 'data-mb');
    if (!b) return;
    setCls($('ov'), 'show', false);
    var fn = btns[+b.getAttribute('data-mb')][2];
    if (fn) fn();
  };
  if (input !== undefined) setTimeout(function () { try { $('mi').focus(); $('mi').select(); } catch (e) {} }, 50);
}

// ───────────── навигация и действия ─────────────
function showPage(p) {
  page = p;
  var pages = PAGES;
  for (var i = 0; i < pages.length; i++) {
    $('pg-' + pages[i]).className = 'page' + (pages[i] === p ? ' show' : '');
    $('nav-' + pages[i]).className = 'nav' + (pages[i] === p ? ' sel' : '');
  }
  if (p === 'Macros') {
    var forms = document.querySelectorAll('.mform');
    for (var j = 0; j < forms.length; j++) forms[j].style.display = forms[j].id === 'mf-' + sid(curMacro) ? 'block' : 'none';
    var lis = document.querySelectorAll('#pg-Macros .li');
    for (var n = 0; n < lis.length; n++) setCls(lis[n], 'sel', lis[n].getAttribute('data-sec') === curMacro);
  }
  $('content').scrollTop = 0;
  hideTip();
  hidePops();
  call('setPage', p);
  if (S) { if (p === 'Custom') syncCustom(); update(); }
}
function isPresetOrBuiltin(sec) {
  for (var i = 0; i < M.builtin.length; i++) if (M.builtin[i].sec === sec) return true;
  return false;
}
function act(a, el, e) {
  var sec = el.getAttribute('data-sec'), name = el.getAttribute('data-name');
  switch (a) {
    case 'cap': if (pickNorm === el.getAttribute('data-norm') && hasCls($('kpop'), 'show')) hidePops(); else openKey(el); break;
    case 'profmenu': if (hasCls($('ppop'), 'show')) hidePops(); else openProfMenu(el); break;
    case 'assign':
      var curv = cv(sec, el.getAttribute('data-key')), nv = (curv !== '' && keyNorm(curv) === pickNorm) ? '' : pickNorm;
      setLocal(sec, el.getAttribute('data-key'), nv); update();
      var ke = findCap(pickNorm); if (ke) openKey(ke);
      call('setVal', sec, el.getAttribute('data-key'), nv);
      break;
    case 'hue':
      var r = el.getBoundingClientRect(), x = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      var hx = hsl(x * 330, 0.82, 0.56);
      setLocal('General', 'AccentColor', hx); setLocal('General', 'Theme', 'custom'); applyTheme(); update();
      call('setVal', 'General', 'AccentColor', hx); call('setVal', 'General', 'Theme', 'custom');
      break;
    case 'switchProfile': hidePops(); call('switchProfile', name); break;
    case 'newProfile': call('newProfile'); break;
    case 'importProfile': call('importProfile'); break;
    case 'dupProfile': call('dupProfile', name); break;
    case 'exportProfile': call('exportProfile', name); break;
    case 'renameProfile': modalInput('Переименовать профиль', name, function (v) { call('renameProfile', name, v); }); break;
    case 'deleteProfile':
      modal('Удалить профиль?', '«' + name + '» будет удалён вместе с его файлом.', [['Отмена', ''], ['Удалить', 'danger', function () { call('deleteProfile', name); }]]);
      break;
    case 'resetSec':
      modal('Сбросить настройки?', 'Настройки этого макроса вернутся к стандартным.', [['Отмена', ''], ['Сбросить', 'pri', function () { call('resetSec', sec); }]]);
      break;
    case 'resetGroup':
      var g = el.getAttribute('data-g'), what = { macros: 'Все встроенные макросы', binds: 'Бинды Fortnite', crosshair: 'Настройки прицела' }[g];
      modal('Сбросить к стандартным?', what + ' в текущем профиле вернутся к стандартным значениям.', [['Отмена', ''], ['Сбросить', 'pri', function () { call('resetGroup', g); }]]);
      break;
    case 'newRemap': call('newRemap'); break;
    case 'delRemap': call('deleteSec', sec); break;
    case 'nav': showPage(el.getAttribute('data-page')); break;
    case 'macro': case 'sub':
      if (isPresetOrBuiltin(sec)) { curMacro = sec; showPage('Macros'); } else { curCustom = sec; showPage('Custom'); }
      break;
    case 'cust': curCustom = sec; syncCustom(); update(); break;
    case 'toggle':
      var v = isOn(cv(sec, el.getAttribute('data-key'))) ? '0' : '1';
      setLocal(sec, el.getAttribute('data-key'), v); update();
      call('setVal', sec, el.getAttribute('data-key'), v);
      break;
    case 'seg':
      var holder = up(el, 'data-t'), hs = holder.getAttribute('data-sec'), hk = holder.getAttribute('data-key'), val = el.getAttribute('data-val');
      if (!hs) return;
      setLocal(hs, hk, val); update(); applyTheme();
      call('setVal', hs, hk, val);
      break;
    case 'key':
      if (!sec || capEl) return;
      capEl = el; setCls(el, 'cap', true); el.innerHTML = 'Нажми…';
      hideTip();
      call('capture', sec, el.getAttribute('data-key'));
      break;
    case 'newCustom':
      var r = call('newCustom');
      if (r) { curCustom = r; showPage('Custom'); }
      break;
    case 'delCustom':
      var cs = curCustom;
      if (!cs) return;
      modal('Удалить макрос?', '«' + cs.substr(6) + '» будет удалён без возможности восстановления.', [['Отмена', ''], ['Удалить', 'danger', function () { call('deleteCustom', cs); }]]);
      break;
    case 'susp': call('toggleMacros'); break;
    case 'import': call('importBinds'); break;
    case 'openCfg': call('openConfig'); break;
    case 'openDir': call('openFolder'); break;
    case 'quit': modal('Выйти из FlashMacro?', 'Макросы перестанут работать до следующего запуска.', [['Отмена', ''], ['Выйти', 'danger', function () { call('quit'); }]]); break;
    case 'min': call('minimize'); break;
    case 'hide': call('hide'); break;
  }
}
document.onclick = function (e) {
  e = e || window.event;
  var t = e.target || e.srcElement, el = up(t, 'data-act');
  if (!up(t, 'data-pop') && !(el && /^(cap|profmenu)$/.test(el.getAttribute('data-act')))) hidePops();
  if (el) act(el.getAttribute('data-act'), el, e);
};
document.onkeydown = function (e) {
  e = e || window.event;
  if (e.keyCode === 27) { hidePops(); setCls($('ov'), 'show', false); }
  if (e.keyCode === 13 && hasCls($('ov'), 'show') && $('mi')) {
    var bs = $('dlg').querySelectorAll('[data-mb]'); if (bs.length) bs[bs.length - 1].click();
  }
};
function hsl(h, s, l) {
  var c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2, r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  function hx(v) { var t = Math.round((v + m) * 255).toString(16); return t.length < 2 ? '0' + t : t; }
  return (hx(r) + hx(g) + hx(b)).toUpperCase();
}
document.onmousedown = function (e) {
  e = e || window.event;
  hideTip();
  var t = e.target || e.srcElement;
  if ((e.button === 0 || e.button === 1) && up(t, 'data-drag') && !up(t, 'data-act')) call('drag');
};
document.oncontextmenu = function () { return false; };
document.onselectstart = function (e) { e = e || window.event; var t = e.target || e.srcElement; return t.tagName === 'INPUT'; };

// Поля ввода: применяем с небольшой задержкой, пока человек печатает
function wireInputs() {
  var ins = document.getElementsByTagName('input');
  for (var i = 0; i < ins.length; i++) ins[i].oninput = onInput;
}
function onInput(e) {
  e = e || window.event;
  var el = e.target || e.srcElement;
  if (el.getAttribute('data-t') === 'name') {
    clearTimeout(timers.rename);
    timers.rename = setTimeout(function () {
      var r = call('renameCustom', curCustom, el.value);
      if (r) curCustom = r;
    }, 700);
    return;
  }
  var sec = el.getAttribute('data-sec'), key = el.getAttribute('data-key');
  if (!sec) return;
  setLocal(sec, key, el.value);
  if (sec === 'Crosshair') drawPreview();
  if (key === 'AccentColor' && /^[0-9A-Fa-f]{6}$/.test(el.value)) { setLocal('General', 'Theme', 'custom'); applyTheme(); call('setVal', 'General', 'Theme', 'custom'); }
  var id = sec + '|' + key;
  clearTimeout(timers[id]);
  timers[id] = setTimeout(function () { call('setVal', sec, key, el.value); }, 450);
}

// ───────────── подсказки при наведении ─────────────
var tipEl = null, tipT = 0, mx = 0, my = 0;
document.onmousemove = function (e) { e = e || window.event; mx = e.clientX; my = e.clientY; };
document.onmouseover = function (e) {
  e = e || window.event;
  var t = e.target || e.srcElement, el = up(t, 'data-cap') || up(t, 'data-tip');
  if (el && !el.getAttribute('data-cap') && !el.getAttribute('data-tip')) el = null;
  if (el === tipEl) return;
  hideTip();
  tipEl = el;
  if (!el) return;
  tipT = setTimeout(showTip, 380);
};
function showTip() {
  if (!tipEl || capEl) return;
  var txt = tipEl.getAttribute('data-cap') ? capTip(tipEl.getAttribute('data-norm')) : tipEl.getAttribute('data-tip');
  if (!txt) return;
  var tip = $('tip');
  tip.innerHTML = esc(txt).replace(/\n/g, '<br>');
  var w = tip.offsetWidth, h = tip.offsetHeight, W = document.documentElement.clientWidth, H = document.documentElement.clientHeight;
  var x = mx + 14, y = my + 18;
  if (x + w > W - 8) x = Math.max(8, mx - w - 10);
  if (y + h > H - 8) y = Math.max(8, my - h - 12);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
  setCls(tip, 'show', true);
}
function hideTip() { clearTimeout(tipT); setCls($('tip'), 'show', false); }
</script>
