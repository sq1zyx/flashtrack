<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Спарк</title>
<meta name="description" content="Спарк — учебные квесты по школьной программе 5–11 класс. Работает офлайн.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one screen, no scroll. Info left, floating 3D phone centre, feature rail right; stacks top/middle/bottom on phones */
:root{
  --bg:#eceef6; --ink:#12131a; --mute:#767a8f; --line:rgba(18,19,26,.12);
  --fa:#4f46e5; --spark:#ff8a1f;
  --frame:#3a33a8; --back:#4f46e5;
  --sbg:#f4f5f7; --sfg:#12131a; --sac:#4f46e5; --scard:#ffffff;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --sans:"Manrope",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}

/* ---------- atmosphere ---------- */
.atmo{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;transition:background 1.2s ease}
.blob.a{width:60vmax;height:60vmax;left:-15vmax;top:-20vmax;background:color-mix(in srgb,var(--fa),transparent 55%);animation:drift1 22s ease-in-out infinite alternate}
.blob.b{width:50vmax;height:50vmax;right:-18vmax;bottom:-22vmax;background:color-mix(in srgb,var(--spark),transparent 60%);animation:drift2 26s ease-in-out infinite alternate}
.blob.c{width:34vmax;height:34vmax;left:40%;top:40%;background:color-mix(in srgb,var(--fa),#fff 40%);opacity:.5;animation:drift3 18s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(12vmax,8vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(-10vmax,-6vmax) scale(1.15)}}
@keyframes drift3{to{transform:translate(-14vmax,-10vmax) scale(.9)}}
.grain{position:absolute;inset:0;opacity:.35;background-image:radial-gradient(rgba(18,19,26,.09) 1px,transparent 1px);background-size:22px 22px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
.ghost{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:800 clamp(140px,30vw,560px)/1 var(--display);letter-spacing:-.06em;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--fa),transparent 70%);white-space:nowrap;transition:-webkit-text-stroke-color 1.2s}

/* ---------- frame ---------- */
.app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:auto 1fr auto;
  padding:max(20px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(28px,env(safe-area-inset-left))}
.top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;z-index:3}
.brand{display:flex;align-items:center;gap:10px;font:800 15px var(--display);letter-spacing:-.02em;text-transform:none}
.brand img{width:30px;height:30px;border-radius:9px;box-shadow:0 6px 16px color-mix(in srgb,var(--fa),transparent 60%)}
.top .meta{display:flex;gap:22px;color:var(--mute)}
.top .live{display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.top .live i{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

/* info */
.info{grid-column:1;grid-row:2;align-self:center;z-index:3;max-width:440px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;padding:7px 12px 7px 8px;border-radius:30px;background:rgba(255,255,255,.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 6px 20px rgba(20,20,60,.06)}
.eyebrow b{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:14px;background:var(--fa);color:#fff;font-weight:500;transition:background .8s}
.title{margin:22px 0 18px;font:800 clamp(40px,4.4vw,78px)/.98 var(--display);letter-spacing:-.045em;text-wrap:balance}
.title .ln{display:block;overflow:hidden;padding-bottom:.06em}
.title .ln span{display:inline-block;transform:translateY(110%);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.title .ln:nth-child(2) span{transition-delay:.06s;color:var(--fa)}
.show .title .ln span{transform:none}
.desc{font-size:17px;line-height:1.55;color:#3d4052;max-width:38ch;opacity:0;transform:translateY(12px);transition:opacity .7s .15s,transform .7s .15s}
.show .desc{opacity:1;transform:none}
.stats{display:flex;gap:28px;margin-top:28px;opacity:0;transition:opacity .7s .25s}
.show .stats{opacity:1}
.stats div{display:flex;flex-direction:column;gap:4px}
.stats b{font:700 26px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stats small{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.themes{display:none;flex-wrap:wrap;gap:8px;margin-top:22px}
.themes.on{display:flex}
.themes button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 4px 10px rgba(0,0,0,.12);transition:transform .25s}
.themes button[aria-pressed=true]{transform:scale(1.15);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.themes button:focus-visible{outline:2px solid var(--fa);outline-offset:3px}

/* stage */
.stage{grid-column:2;grid-row:2;position:relative;perspective:1500px;z-index:2}
.phone-wrap{position:absolute;left:50%;top:50%;transform-style:preserve-3d;will-change:transform}
.shadow{position:absolute;left:50%;bottom:4%;width:46%;height:18px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(rgba(20,20,60,.28),transparent 70%);filter:blur(6px);animation:sh 6s ease-in-out infinite}
@keyframes sh{50%{transform:translateX(-50%) scale(.82);opacity:.7}}

.prop{position:absolute;pointer-events:none;z-index:1;animation:float 7s ease-in-out infinite}
.prop img{display:block;width:100%;height:auto}
.prop.mul img{filter:drop-shadow(0 22px 26px rgba(20,20,60,.22))}
.prop.card img{border-radius:22%;box-shadow:0 24px 40px rgba(20,20,60,.25)}
.prop.q{background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-radius:16px;padding:12px 14px;width:190px;font:700 12px/1.35 var(--sans);box-shadow:0 24px 40px rgba(20,20,60,.15)}
.prop.q small{display:block;font:500 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fa);margin-bottom:6px}
.prop.q b{display:block;margin-top:8px;padding:6px 10px;border-radius:9px;background:#e7f7ec;color:#1d7a3b}
.prop.chip{background:var(--ink);color:#fff;border-radius:30px;padding:9px 14px;font:700 12px var(--sans);box-shadow:0 18px 30px rgba(20,20,60,.25);white-space:nowrap}
@keyframes float{0%,100%{transform:translate(0,0) rotate(var(--r,0deg))}50%{transform:translate(0,-16px) rotate(calc(var(--r,0deg) + 4deg))}}

/* rail */
.rail{grid-column:3;grid-row:2;align-self:center;justify-self:end;z-index:3;display:flex;flex-direction:column;gap:4px;width:min(280px,100%)}
.rail button{all:unset;cursor:pointer;position:relative;display:grid;grid-template-columns:34px 1fr;align-items:center;padding:13px 14px;border-radius:14px;transition:background .3s}
.rail button:hover{background:rgba(255,255,255,.45)}
.rail button:focus-visible{outline:2px solid var(--fa);outline-offset:2px}
.rail .n{font:500 11px var(--mono);color:var(--mute)}
.rail .t{font:700 15px var(--sans);color:var(--mute);transition:color .3s}
.rail .bar{position:absolute;left:14px;right:14px;bottom:6px;height:2px;border-radius:2px;background:var(--line);overflow:hidden;opacity:0;transition:opacity .3s}
.rail .bar i{position:absolute;inset:0;background:var(--fa);transform-origin:left;transform:scaleX(0)}
.rail button[aria-current=true]{background:rgba(255,255,255,.7);box-shadow:0 8px 24px rgba(20,20,60,.07)}
.rail button[aria-current=true] .t{color:var(--ink)}
.rail button[aria-current=true] .n{color:var(--fa)}
.rail button[aria-current=true] .bar{opacity:1}

.bottom{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;z-index:3;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.ticker{display:flex;gap:10px;flex-wrap:wrap}
.ticker span{padding:7px 11px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.4)}
.ctrl{display:flex;gap:8px}
.ctrl button{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.55);color:var(--ink);font:500 14px var(--sans);transition:background .2s}
.ctrl button:hover{background:#fff}
.ctrl button:focus-visible{outline:2px solid var(--fa);outline-offset:2px}

/* ---------- phone ---------- */
.phone{position:relative;transform-style:preserve-3d;width:var(--w);height:var(--h)}
.phone > *{position:absolute;inset:0;border-radius:var(--r)}
.ph-layer{background:var(--frame);transition:background .8s}
.ph-front{background:#06060a;padding:calc(var(--w)*.03);backface-visibility:hidden}
.ph-back{background:radial-gradient(120% 80% at 30% 20%,color-mix(in srgb,var(--back),#fff 25%),var(--back) 50%,color-mix(in srgb,var(--back),#000 35%));backface-visibility:hidden;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:background .8s}
.ph-back img{width:34%;border-radius:22%;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.ph-back .cam{position:absolute;top:4%;left:7%;width:calc(var(--w)*.34);height:calc(var(--w)*.34);border-radius:calc(var(--w)*.08);background:rgba(0,0,0,.25);display:grid;grid-template-columns:1fr 1fr;gap:8%;padding:8%}
.ph-back .cam i{border-radius:50%;background:radial-gradient(circle at 36% 32%,rgba(140,150,255,.6) 0 8%,transparent 9%),radial-gradient(circle,#06060a 0 45%,#2a2b33 47% 60%,#0a0a0d 62% 72%,#aaa 74%)}
.ph-back .mark{position:absolute;bottom:7%;left:0;right:0;text-align:center;font:700 calc(var(--w)*.04) var(--display);letter-spacing:.2em;color:rgba(255,255,255,.6)}
.glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent calc(var(--g,40%) - 18%),rgba(255,255,255,.2) var(--g,40%),transparent calc(var(--g,40%) + 14%));mix-blend-mode:screen}

.screen{position:relative;width:100%;height:100%;border-radius:calc(var(--r)*.78);overflow:hidden;background:var(--sbg);color:var(--sfg);font-family:var(--sans);font-size:calc(var(--w)*.045);transition:background .6s,color .6s}
.punch{position:absolute;top:1.6%;left:50%;width:calc(var(--w)*.04);aspect-ratio:1;border-radius:50%;background:#000;transform:translateX(-50%);z-index:5}
.sbar{position:absolute;top:1.2%;left:7%;right:7%;display:flex;justify-content:space-between;font:700 .8em var(--sans);z-index:4}
.scr{position:absolute;inset:0;padding:12% 6% 0;opacity:0;transition:opacity .35s;display:flex;flex-direction:column;gap:.8em}
.scr.on{opacity:1}
.stop{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.stop .logo{font:800 1.25em var(--display);letter-spacing:-.03em}
.pills{display:flex;gap:.4em}
.pills span{background:var(--scard);border-radius:2em;padding:.25em .6em;font-size:.78em;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sc{background:var(--scard);border-radius:1em;padding:.9em;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.sc h4{font-size:1em;font-weight:800;margin-bottom:.3em}
.sc p{font-size:.8em;opacity:.7}
.pb{height:.45em;border-radius:1em;background:color-mix(in srgb,var(--sac),transparent 82%);overflow:hidden;margin-top:.6em}
.pb i{display:block;height:100%;border-radius:inherit;background:var(--sac)}
.btnx{background:var(--sac);color:#fff;border-radius:.8em;padding:.75em;text-align:center;font-weight:800;font-size:.9em}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:.45em}
.chips span{background:var(--scard);border-radius:.8em;padding:.6em;font-size:.75em;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.q{font-weight:800;font-size:1.05em;line-height:1.3}
.opt{background:var(--scard);border-radius:.8em;padding:.7em .9em;font-weight:700;font-size:.9em;border:2px solid transparent;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.opt.ok{border-color:#22a35a;background:#e7f7ec;color:#14532d}
.opt.bad{border-color:#e5484d;background:#fdecec;color:#7f1d1d}
.meta{display:flex;justify-content:space-between;font-size:.75em;font-weight:700;opacity:.65}
.toast{align-self:center;background:#14532d;color:#fff;border-radius:2em;padding:.4em .9em;font-size:.8em;font-weight:800}
.mrow{display:flex;justify-content:space-between;align-items:center;font-size:.8em;font-weight:700}
.mrow + .pb{margin-top:.3em}
.ai-b{background:color-mix(in srgb,var(--sac),var(--scard) 88%);border:1px solid color-mix(in srgb,var(--sac),transparent 60%);border-radius:1em;padding:.9em;font-size:.82em;line-height:1.45}
.ai-b b{display:block;color:var(--sac);margin-bottom:.3em}
.typing{display:inline-block;width:.5em;height:1em;background:var(--sac);vertical-align:-.15em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pet{align-self:center;width:62%;border-radius:1em;overflow:hidden;position:relative;aspect-ratio:1;background:#fff}
.pet img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pet .sprout{animation:grow 4s ease-in-out infinite alternate}
@keyframes grow{0%,40%{opacity:0}60%,100%{opacity:1}}
.streak{display:flex;gap:.3em;justify-content:space-between}
.streak span{flex:1;text-align:center;background:var(--scard);border-radius:.6em;padding:.45em 0;font-size:.7em;font-weight:800}
.streak span.f{background:var(--spark);color:#fff}
.cases{display:grid;grid-template-columns:1fr 1fr;gap:.5em}
.cases div{border-radius:.9em;overflow:hidden;background:var(--scard);font-size:.72em;font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cases img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.cases div span{display:flex;justify-content:space-between;padding:.4em .6em}
.cases em{font-style:normal}
.thm{display:grid;grid-template-columns:1fr 1fr;gap:.5em}
.thm div{border-radius:.9em;padding:.7em;font-size:.72em;font-weight:800;color:#fff;aspect-ratio:1.3;display:flex;flex-direction:column;justify-content:space-between}
.thm div small{font-weight:700;opacity:.85}
.tabs{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:.7em 0 1.2em;background:var(--scard);font-size:.62em;font-weight:700;opacity:.95}
.tabs span{opacity:.45}.tabs span.a{opacity:1;color:var(--sac)}

/* ---------- phones / narrow ---------- */
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto auto;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  .top .meta span:not(.live){display:none}
  .info{grid-column:1;grid-row:2;max-width:none;margin-top:14px}
  .eyebrow{font-size:10px}
  .title{font-size:clamp(28px,8.4vw,44px);margin:12px 0 8px}
  .title .ln{display:inline-block;margin-right:.25em}
  .desc{font-size:14px;line-height:1.45}
  .stats{display:none}
  .themes{margin-top:10px}
  .themes button{width:28px;height:28px}
  .stage{grid-column:1;grid-row:3;min-height:0}
  .rail{grid-column:1;grid-row:4;flex-direction:row;width:auto;justify-self:stretch;overflow-x:auto;gap:4px;scrollbar-width:none;margin-top:6px}
  .rail::-webkit-scrollbar{display:none}
  .rail button{grid-template-columns:auto;padding:10px 12px;flex:none}
  .rail .n{display:none}
  .rail .t{font-size:13px}
  .rail .bar{left:10px;right:10px;bottom:4px}
  .bottom{grid-row:5;margin-top:8px}
  .ticker{display:none}
  .prop.hide-m{display:none}
}
@media (max-height:620px) and (min-width:901px){ .desc{font-size:15px} .stats{display:none} }
@media (prefers-reduced-motion:reduce){
  .blob,.prop,.shadow,.typing,.pet .sprout,.top .live i{animation:none}
}
</style>
</head>
<body>
<div class="atmo"><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div><div class="grain"></div><div class="ghost">СПАРК</div></div>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><img src="img/icon-192.png" alt="">Спарк</div>
    <div class="meta"><span>5–11 класс</span><span>ОГЭ · ЕГЭ · ВПР</span><span class="live"><i></i>Работает офлайн</span></div>
  </header>

  <section class="info" id="info" aria-live="polite">
    <div class="eyebrow"><b id="num">01</b><span id="tag">Квесты</span></div>
    <h1 class="title"><span class="ln"><span id="h1a"></span></span><span class="ln"><span id="h1b"></span></span></h1>
    <p class="desc" id="desc"></p>
    <div class="themes" id="themes" aria-label="Темы оформления"></div>
    <div class="stats" id="stats"></div>
  </section>

  <div class="stage" id="stage">
    <div class="shadow"></div>
    <div class="phone-wrap" id="pw"></div>
  </div>

  <nav class="rail" id="rail" aria-label="Разделы"></nav>

  <footer class="bottom">
    <div class="ticker"><span>6 000+ заданий</span><span>11 предметов</span><span>Питомец и стрик</span><span>Кейсы и темы</span></div>
    <div class="ctrl"><button id="prev" aria-label="Предыдущий раздел">←</button><button id="play" aria-label="Пауза">❚❚</button><button id="next" aria-label="Следующий раздел">→</button></div>
  </footer>
</div>

<script>
(() => {

    {name:'Неон',      bg:'#05010f', ac:'#ff2ec4', fg:'#f4eaff', card:'#160b2b'},
    {name:'Лава',      bg:'#1a0505', ac:'#ff4500', fg:'#ffece4', card:'#2c0d08'},
    {name:'Галактика', bg:'#0a0521', ac:'#7c3aed', fg:'#ece6ff', card:'#1a1240'},
  ];
  const F = [
    {tag:'Квесты', a:'Домашка', b:'как квест.', fa:'#4f46e5', s:1,
     d:'Каждая тема — короткий квест из 10 заданий. Ответил верно — получил осколки и пошёл дальше.',
     st:[['6 000+','заданий'],['10','в квесте'],['💎','награда']]},
    {tag:'Карта', a:'11 предметов.', b:'7 классов.', fa:'#0891b2', s:2,

    {tag:'ИИ', a:'Ошибся?', b:'Объясним.', fa:'#7c3aed', s:3,
     d:'ИИ-ассистент разбирает ошибку и объясняет тему простыми словами. «Разбор ошибок» собирает всё, что стоит повторить.',
     st:[['✦','ИИ-разбор'],['1 тап','объяснение']]},
    {tag:'Питомец', a:'Учись —', b:'он растёт.', fa:'#ff8a1f', s:4,

    {tag:'Кейсы', a:'Осколки', b:'в кейсы.', fa:'#e11d74', s:5,
     d:'Открывай тематические кейсы и сундук удачи. Внутри осколки и шанс выбить редкую тему.',
     st:[['5','кейсов'],['от 28','осколков'],['FREE','сундук']]},
    {tag:'Темы', a:'Спарк', b:'в твоих цветах.', fa:'#2e7d32', s:6, themes:true,
     d:'Нажми на кружок — и приложение на телефоне перекрасится.',
     st:[]},
  ];

  const SCREENS = `
    <div class="scr" data-s="0">
      <div class="stop"><span class="logo">Спарк</span><div class="pills"><span>🔥 12</span><span>💎 245</span></div></div>
      <div class="sc"><h4>Квест дня</h4><p>Математика · Дроби</p><div class="pb"><i style="width:60%"></i></div></div>
      <div class="btnx">Продолжить квест</div>
      <div class="chips"><span>📐 Математика</span><span>📖 Русский</span><span>⚛️ Физика</span><span>🧪 Химия</span><span>🌍 География</span><span>💻 Информатика</span></div>
    </div>
    <div class="scr" data-s="1">
      <div class="meta"><span>Математика · 5 класс</span><span>3 / 10</span></div>
      <div class="pb" style="margin-top:0"><i style="width:30%"></i></div>
      <div class="q">Из цифр 3, 0, 7 составь наибольшее трёхзначное число.</div>
      <div class="opt ok">730</div><div class="opt">703</div><div class="opt">370</div><div class="opt">073</div>
      <div class="toast">Верно! +10 💎</div>
    </div>
    <div class="scr" data-s="2">
      <div class="stop"><span class="logo">Карта</span><div class="pills"><span>7 класс</span></div></div>
      ${[['Математика',72],['Русский язык',48],['Физика',35],['История',60],['Биология',22],['Английский',54],['Химия',12]].map(([n,v]) => `<div><div class="mrow"><span>${n}</span><span>${v}%</span></div><div class="pb"><i style="width:${v}%"></i></div></div>`).join('')}
    </div>
    <div class="scr" data-s="3">
      <div class="meta"><span>Физика · 7 класс</span><span>6 / 10</span></div>
      <div class="q">Единица измерения силы в СИ?</div>
      <div class="opt bad">Джоуль</div><div class="opt ok">Ньютон</div>
      <div class="ai-b"><b>✦ ИИ объясняет</b>Джоуль — это работа и энергия. Силу измеряют в ньютонах: 1 Н разгоняет тело массой 1 кг на 1 м/с². <span class="typing"></span></div>
    </div>
    <div class="scr" data-s="4">
      <div class="stop"><span class="logo">Профиль</span><div class="pills"><span>Знаток</span></div></div>
      <div class="pet"><img src="img/pet-seed.png" alt=""><img class="sprout" src="img/pet-sprout.png" alt=""></div>
      <div class="sc"><h4>Стрик 🔥 12 дней</h4><div class="streak"><span class="f">Пн</span><span class="f">Вт</span><span class="f">Ср</span><span class="f">Чт</span><span class="f">Пт</span><span>Сб</span><span>Вс</span></div></div>
    </div>
    <div class="scr" data-s="5">
      <div class="stop"><span class="logo">Магазин</span><div class="pills"><span>💎 245</span></div></div>
      <div class="cases"><div><img src="img/space.jpg" alt=""><span>Космос<em>💎 35</em></span></div><div><img src="img/ocean.jpg" alt=""><span>Океан<em>💎 28</em></span></div><div><img src="img/sweet.jpg" alt=""><span>Сладкий<em>💎 30</em></span></div><div><img src="img/royal.jpg" alt=""><span>Королевский<em>💎 40</em></span></div></div>
    </div>
    <div class="scr" data-s="6">
      <div class="stop"><span class="logo">Темы</span><div class="pills"><span>💎 245</span></div></div>
      <div class="thm">${THEMES.map(t => `<div style="background:linear-gradient(135deg,${t.ac},${t.bg === '#f4f5f7' || t.bg.startsWith('#e') ? t.ac + 'aa' : t.bg})">${t.name}<small>${['Стандарт','Океан','Лесная'].includes(t.name) ? 'бесплатно' : '💎'}</small></div>`).join('')}</div>
    </div>
    <div class="tabs"><span data-t="0,1,3">Квест</span><span data-t="2">Карта</span><span>Экзамены</span><span data-t="5,6">Магазин</span><span data-t="4">Профиль</span></div>`;

  const root = document.documentElement.style;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const lerp = (a, b, t) => a + (b - a) * t;
  const stage = document.getElementById('stage'), pw = document.getElementById('pw');
  const info = document.getElementById('info');
  let phone, glares;

  function buildPhone() {
    const r0 = stage.getBoundingClientRect();
    const w = Math.round(Math.max(120, Math.min(280, r0.height * 0.84 / 2.1, r0.width * 0.62)));
    const h = w * 2.1, t = w * 0.1, r = w * 0.12;
    pw.innerHTML = '';
    phone = document.createElement('div');
    phone.className = 'phone';
    phone.style.cssText = `--w:${w}px;--h:${h}px;--r:${r}px;margin-left:${-w/2}px;margin-top:${-h/2}px`;
    let layers = '';
    for (let i = 0; i < 16; i++) layers += `<div class="ph-layer" style="transform:translateZ(${-t/2 + (t * i) / 15}px)"></div>`;
    phone.innerHTML = layers + `
      <div class="ph-front" style="transform:translateZ(${t/2 + .5}px)">
        <div class="screen"><div class="punch"></div><div class="sbar"><span>9:41</span><span>5G 87%</span></div>${SCREENS}</div>
        <div class="glare"></div>
      </div>
      <div class="ph-back" style="transform:rotateY(180deg) translateZ(${t/2 + .5}px)">
        <div class="cam"><i></i><i></i><i></i></div>
        <img src="img/icon-192.png" alt=""><div class="mark">СПАРК</div><div class="glare"></div>
      </div>`;
    pw.appendChild(phone);
    glares = phone.querySelectorAll('.glare');
    showScreen(F[cur].s);
    placeProps(w, h);
  }

  function showScreen(s) {
    phone.querySelectorAll('.scr').forEach(el => el.classList.toggle('on', +el.dataset.s === s));
    phone.querySelectorAll('.tabs span').forEach(el => el.classList.toggle('a', (el.dataset.t || '').split(',').includes(String(s))));
  }

  // floating props placed around the phone, relative to its size
  const PROPS = [
    {html:'<img src="img/pet-seed.png" alt="">', cls:'mul', w:.46, x:-.95, y:-.46, r:-10},
    {html:'<img src="img/space.jpg" alt="">', cls:'card', w:.52, x:.95, y:-.5, r:9},
    {html:'<img src="img/chest-free.png" alt="">', cls:'mul hide-m', w:.68, x:-1.05, y:.38, r:-6},
    {html:'<img src="img/currency-shard.png" alt="">', cls:'mul', w:.46, x:.92, y:.34, r:12},
    {html:'<small>Математика · 5 кл</small>Из цифр 3, 0, 7 составь наибольшее трёхзначное число.<b>730 ✓</b>', cls:'q hide-m', w:0, x:.78, y:-.06, r:4},
    {html:'🔥 Стрик 12 дней', cls:'chip hide-m', w:0, x:-.9, y:-.02, r:-4},
  ];
  function placeProps(w, h) {
    stage.querySelectorAll('.prop').forEach(p => p.remove());
    const r0 = stage.getBoundingClientRect(), cx = r0.width / 2, cy = r0.height / 2;
    const narrow = innerWidth <= 900;
    PROPS.forEach((p, i) => {
      const el = document.createElement('div');
      el.className = 'prop ' + p.cls;
      el.innerHTML = p.html;
      const pwid = p.w ? w * p.w * (narrow ? .7 : 1) : null;
      if (pwid) el.style.width = pwid + 'px';
      const spreadX = narrow ? Math.min(w * .95, r0.width / 2 - 10) : w * 1.05;
      el.style.left = (cx + p.x * spreadX - (pwid || 0) / 2) + 'px';
      el.style.top = (cy + p.y * h - (pwid || 0) / 2) + 'px';
      if (!pwid) el.style.transform = 'translateX(-50%)';
      el.style.setProperty('--r', p.r + 'deg');
      el.style.animationDelay = (-i * 1.3) + 's';
      el.style.animationDuration = (6 + i % 3) + 's';
      stage.appendChild(el);
    });
  }

  // ---------- state ----------
  let cur = 0, ry = -18, tRy = -18, mx = 0, my = 0, cmx = 0, cmy = 0, playing = !reduce, t0 = performance.now();
  const DUR = 6000;
  const rail = document.getElementById('rail');
  F.forEach((f, i) => {
    const b = document.createElement('button');
    b.innerHTML = `<span class="n">0${i + 1}</span><span class="t">${f.tag}</span><span class="bar"><i></i></span>`;
    b.addEventListener('click', () => go(i, true));
    rail.appendChild(b);
  });
  const btns = [...rail.children];

  const themesBox = document.getElementById('themes');
  THEMES.forEach((t, i) => {
    const b = document.createElement('button');
    b.style.background = `linear-gradient(135deg,${t.bg} 50%,${t.ac} 50%)`;
    b.setAttribute('aria-label', t.name);
    b.setAttribute('aria-pressed', i === 0);
    b.addEventListener('click', () => {
      themesBox.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
      root.setProperty('--sbg', t.bg); root.setProperty('--sac', t.ac); root.setProperty('--sfg', t.fg); root.setProperty('--scard', t.card);
      root.setProperty('--back', t.ac); root.setProperty('--frame', `color-mix(in srgb, ${t.ac}, #000 30%)`);
      root.setProperty('--fa', t.ac);
      showScreen(0);
      setPlaying(false);
    });
    themesBox.appendChild(b);
  });

  function render(f, i) {
    document.getElementById('num').textContent = String(i + 1).padStart(2, '0');
    document.getElementById('tag').textContent = f.tag;
    document.getElementById('h1a').textContent = f.a;
    document.getElementById('h1b').textContent = f.b;
    document.getElementById('desc').textContent = f.d;
    document.getElementById('stats').innerHTML = f.st.map(([b, s]) => `<div><b>${b}</b><small>${s}</small></div>`).join('');
    themesBox.classList.toggle('on', !!f.themes);
  }

  function go(i, user) {
    i = (i + F.length) % F.length;
    if (user) setPlaying(false);
    const dir = i >= cur ? 1 : -1;
    cur = i; t0 = performance.now();
    btns.forEach((b, k) => b.setAttribute('aria-current', k === i));
    const f = F[i];
    root.setProperty('--fa', f.fa);
    info.classList.remove('show');
    tRy += dir * 360;                                  // full turn; screen swaps while the back faces us
    setTimeout(() => showScreen(f.s), reduce ? 0 : 420);
    setTimeout(() => { render(f, i); void info.offsetWidth; info.classList.add('show'); }, 260);
    if (btns[i].scrollIntoView && innerWidth <= 900) btns[i].scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
  }

  const playBtn = document.getElementById('play');
  function setPlaying(v) {
    playing = v; t0 = performance.now();
    playBtn.textContent = v ? '❚❚' : '▶';
    playBtn.setAttribute('aria-label', v ? 'Пауза' : 'Автопоказ');
  }
  playBtn.addEventListener('click', () => setPlaying(!playing));
  document.getElementById('prev').addEventListener('click', () => go(cur - 1, true));
  document.getElementById('next').addEventListener('click', () => go(cur + 1, true));
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(cur + 1, true);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') go(cur - 1, true);
  });
  let sx = null;
  stage.addEventListener('pointerdown', e => { sx = e.clientX; });
  addEventListener('pointerup', e => { if (sx !== null && Math.abs(e.clientX - sx) > 40) go(cur + (e.clientX < sx ? 1 : -1), true); sx = null; });
  addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });

  function frame(now) {
    ry = reduce ? tRy : lerp(ry, tRy, .07);
    cmx = lerp(cmx, mx, .05); cmy = lerp(cmy, my, .05);
    const tt = now / 1000;
    const bob = reduce ? 0 : Math.sin(tt * 1.1) * 10;
    const sway = reduce ? 0 : Math.sin(tt * .6) * 6;
    pw.style.transform = `translate3d(0,${bob}px,0) rotateX(${8 - cmy * 14}deg) rotateY(${ry + sway + cmx * 22}deg) rotateZ(${Math.sin(tt * .5) * 2}deg)`;
    const g = ((ry % 360) + 360) % 360;
    glares.forEach(el => el.style.setProperty('--g', `${50 + Math.sin(g * Math.PI / 180) * 60}%`));
    const p = playing ? Math.min(1, (now - t0) / DUR) : 0;
    const bar = btns[cur].querySelector('.bar i');
    bar.style.transform = `scaleX(${playing ? p : 1})`;
    btns.forEach((b, k) => { if (k !== cur) b.querySelector('.bar i').style.transform = 'scaleX(0)'; });
    if (playing && p >= 1) go(cur + 1, false);
    requestAnimationFrame(frame);
  }

  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(buildPhone, 150); });
  buildPhone();
  go(0, false);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
