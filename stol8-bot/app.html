<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Дневник</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-secondary-bg-color, #f2f2f7);
  --card: var(--tg-theme-bg-color, #ffffff);
  --text: var(--tg-theme-text-color, #111111);
  --hint: var(--tg-theme-hint-color, #8e8e93);
  --accent: var(--tg-theme-button-color, #2481cc);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --line: color-mix(in srgb, var(--hint) 22%, transparent);
  --good: #34c759; --warn: #ff9f0a; --bad: #ff453a;
  --p: #5e5ce6; --f: #ff9f0a; --c: #30b0c7; --water: #0a84ff;
  --r: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", sans-serif; }
body { padding: 12px 12px calc(84px + env(safe-area-inset-bottom)); }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); font-weight: 600; margin: 18px 6px 8px; }
.card { background: var(--card); border-radius: var(--r); padding: 14px; margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.muted { color: var(--hint); font-size: 13px; }
.big { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
.mid { font-size: 18px; font-weight: 650; }
.chip { border: 0; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); padding: 8px 12px; border-radius: 999px; font: inherit; font-weight: 600; cursor: pointer; }
.chip.on { background: var(--accent); color: var(--accent-text); }
.btn { border: 0; background: var(--accent); color: var(--accent-text); padding: 12px 16px; border-radius: 12px; font: inherit; font-weight: 650; width: 100%; cursor: pointer; }
.btn.ghost { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
.btn.danger { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
input, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%; outline: none; }
input:focus, textarea:focus { border-color: var(--accent); }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 5; }
.tabs button { flex: 1; border: 0; background: none; color: var(--hint); font: 11px/1.2 inherit; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; cursor: pointer; }
.tabs button b { font-size: 21px; font-weight: 400; filter: grayscale(1); opacity: .7; }
.tabs button.on { color: var(--accent); }
.tabs button.on b { filter: none; opacity: 1; }
.ringwrap { position: relative; width: 168px; height: 168px; flex: none; }
.ringwrap .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; transition: width .4s ease; }
.macro { flex: 1; min-width: 0; }
.macro .muted { font-size: 12px; }
.glasses { display: flex; gap: 4px; margin: 10px 0; }
.glass { flex: 1; height: 30px; border-radius: 5px 5px 8px 8px; border: 2px solid color-mix(in srgb, var(--water) 45%, transparent); position: relative; overflow: hidden; }
.glass i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--water); opacity: .85; }
.list .it { display: flex; align-items: center; gap: 10px; padding: 11px 2px; border-top: 1px solid var(--line); cursor: pointer; }
.list .it:first-child { border-top: 0; }
.it .t { font-variant-numeric: tabular-nums; color: var(--hint); font-size: 13px; width: 42px; flex: none; }
.it .n { flex: 1; min-width: 0; }
.it .n div:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.it .k { font-weight: 650; font-variant-numeric: tabular-nums; }
.seg { display: flex; background: var(--card); border-radius: 12px; padding: 3px; gap: 3px; margin-bottom: 10px; overflow-x: auto; }
.seg button { flex: 1; border: 0; background: none; color: var(--text); padding: 8px 10px; border-radius: 9px; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
.seg button.on { background: var(--accent); color: var(--accent-text); }
svg text { fill: var(--hint); font-size: 10px; font-family: inherit; }
.ex h3 { margin: 0 0 2px; font-size: 16px; }
.sets { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.set { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); border-radius: 8px; padding: 4px 8px; font-weight: 650; font-size: 13px; }
.stepper { display: flex; align-items: center; background: var(--bg); border-radius: 12px; overflow: hidden; flex: 1; }
.stepper button { border: 0; background: none; color: var(--accent); font-size: 22px; width: 42px; height: 44px; cursor: pointer; }
.stepper input { border: 0; background: none; text-align: center; padding: 0; font-weight: 700; font-size: 17px; min-width: 0; }
.stepper small { color: var(--hint); font-size: 11px; margin-right: 6px; }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.ach div { background: var(--bg); border-radius: 12px; padding: 10px 8px; text-align: center; font-size: 12px; opacity: .45; }
.ach div.got { opacity: 1; background: color-mix(in srgb, var(--good) 14%, transparent); }
.ach b { display: block; font-size: 24px; margin-bottom: 4px; }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.photos img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 12px; background: var(--bg); }
.toggle { display: flex; justify-content: space-between; align-items: center; padding: 10px 2px; border-top: 1px solid var(--line); }
.toggle:first-child { border-top: 0; }
.sw { width: 46px; height: 28px; border-radius: 99px; background: var(--line); position: relative; border: 0; cursor: pointer; transition: background .2s; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.sw.on { background: var(--good); }
.sw.on::after { left: 21px; }
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; display: none; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); z-index: 11; transform: translateY(105%); transition: transform .25s ease; max-height: 88vh; overflow-y: auto; }
.sheet.open { transform: none; }
.sheet .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: -8px auto 12px; }
.toast { position: fixed; left: 50%; top: 14px; transform: translate(-50%, -80px); background: rgba(30,30,30,.92); color: #fff; padding: 10px 16px; border-radius: 12px; z-index: 20; transition: transform .25s; font-size: 14px; max-width: 90vw; text-align: center; }
.toast.show { transform: translate(-50%, 0); }
.timer { position: fixed; inset: 0; background: color-mix(in srgb, var(--card) 96%, transparent); z-index: 15; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
.timer.show { display: flex; }
.res { padding: 10px 2px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; cursor: pointer; }
.res:first-child { border-top: 0; }
.tag { font-size: 11px; color: var(--hint); }
.empty { text-align: center; color: var(--hint); padding: 22px 8px; }
.next { color: var(--accent); font-weight: 650; }
.spark { width: 100%; height: 44px; }
</style>
</head>
<body>
<div id="view"><div class="empty">Загрузка…</div></div>

<nav class="tabs" id="tabs">
  <button data-t="today" class="on"><b>🔥</b>Сегодня</button>
  <button data-t="diary"><b>📒</b>Дневник</button>
  <button data-t="charts"><b>📈</b>Графики</button>
  <button data-t="gym"><b>🏋️</b>Зал</button>
  <button data-t="more"><b>⭐</b>Ещё</button>
</nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="timer" id="timer">
  <div class="muted">Отдых</div>
  <div id="timerRing"></div>
  <button class="btn ghost" style="width:auto" id="timerSkip">Пропустить</button>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } catch (e) {} }
const initData = (tg && tg.initData) || '';
let S = null, tab = 'today', chartTab = 'weight', liftKey = null, search = '';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (m) => { m = ((Math.round(m) % 1440) + 1440) % 1440; return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'); };
const n1 = (x) => (Math.round(x * 10) / 10).toString().replace('.', ',');
const ddmm = (d) => d.slice(8, 10) + '.' + d.slice(5, 7);
const haptic = (t) => { try { tg.HapticFeedback.impactOccurred(t || 'light'); } catch (e) {} };
const okHaptic = () => { try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} };
const normq = (s) => String(s).toLowerCase().replace(/ё/g, 'е').trim();

function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 2200); }

async function api(action, extra) {
  try {
    const r = await fetch('/api', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(Object.assign({ initData, action }, extra || {})) });
    const j = await r.json();
    if (j.error) { showError(j.error); return j; }
    if (j.state) { S = j.state; render(); }
    if (j.msg) toast(j.msg);
    return j;
  } catch (e) { toast('Нет связи, попробуй ещё раз'); return {}; }
}
function showError(e) {
  const m = { auth: 'Открой приложение через бота — кнопка «📊 Дневник» в чате.', forbidden: 'Это личный бот.', start: 'Сначала напиши боту /start и пройди настройку.' };
  $('view').innerHTML = '<div class="card empty">' + esc(m[e] || 'Ошибка') + '</div>';
}

// ---------- sheet
function openSheet(html, mount) {
  const sh = $('sheet');
  sh.innerHTML = '<div class="grab"></div>' + html;
  $('backdrop').style.display = 'block';
  requestAnimationFrame(() => sh.classList.add('open'));
  if (mount) mount(sh);
}
function closeSheet() { $('sheet').classList.remove('open'); $('backdrop').style.display = 'none'; }
$('backdrop').onclick = closeSheet;

// ---------- charts (svg)
function ring(v, max, color, size, w) {
  size = size || 168; w = w || 14;
  const r = (size - w) / 2, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, v / (max || 1)));
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="' + w + '"/>' +
    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + w + '" stroke-linecap="round" ' +
    'stroke-dasharray="' + (c * f) + ' ' + c + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')" style="transition:stroke-dasharray .6s ease"/></svg>';
}
function lineChart(pts, o) {
  o = o || {};
  if (pts.length < 2) return '<div class="empty">Нужно хотя бы 2 записи — график появится сам</div>';
  const W = 340, H = 210, L = 34, R = 10, T = 12, B = 24;
  const ys = pts.map((p) => p.y).concat(o.target != null ? [o.target] : []);
  let mn = Math.min.apply(null, ys), mx = Math.max.apply(null, ys);
  if (o.zero) mn = 0;
  const pad = (mx - mn) * 0.12 || 1; mn -= o.zero ? 0 : pad; mx += pad;
  const X = (i) => L + (i * (W - L - R)) / (pts.length - 1), Y = (v) => T + (H - T - B) * (1 - (v - mn) / (mx - mn));
  let g = '';
  for (let k = 0; k <= 3; k++) { const v = mn + ((mx - mn) * k) / 3; g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--line)"/><text x="' + (L - 4) + '" y="' + (Y(v) + 3) + '" text-anchor="end">' + (Math.abs(v) >= 100 ? Math.round(v) : n1(v)) + '</text>'; }
  const step = Math.max(1, Math.ceil(pts.length / 6));
  pts.forEach((p, i) => { if (i % step === 0 || i === pts.length - 1) g += '<text x="' + X(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(p.x) + '</text>'; });
  if (o.target != null) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(o.target) + '" y2="' + Y(o.target) + '" stroke="var(--good)" stroke-dasharray="4 4"/>';
  const col = o.color || 'var(--accent)';
  if (o.bars) {
    const bw = Math.max(3, ((W - L - R) / pts.length) * 0.62);
    pts.forEach((p, i) => {
      const c = o.target != null && p.y > o.target + 400 ? 'var(--warn)' : o.target != null && p.y < o.target - 500 ? 'var(--hint)' : col;
      g += '<rect x="' + (X(i) - bw / 2) + '" y="' + Y(p.y) + '" width="' + bw + '" height="' + Math.max(1, Y(mn) - Y(p.y)) + '" rx="3" fill="' + c + '" opacity="' + (p.today ? 0.5 : 0.9) + '"/>';
    });
  } else {
    const d = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
    g += '<path d="' + d + ' L' + X(pts.length - 1) + ' ' + Y(mn) + ' L' + X(0) + ' ' + Y(mn) + ' Z" fill="' + col + '" opacity=".08"/>';
    g += '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + (o.avg ? 1.5 : 2.5) + '" stroke-linejoin="round" opacity="' + (o.avg ? 0.45 : 1) + '"/>';
    if (o.avg) {
      const a = pts.map((p, i) => { const s = pts.slice(Math.max(0, i - 2), i + 1); return s.reduce((x, q) => x + q.y, 0) / s.length; });
      g += '<path d="' + a.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ') + '" fill="none" stroke="' + col + '" stroke-width="3" stroke-linejoin="round"/>';
    }
    pts.forEach((p, i) => { g += '<circle cx="' + X(i) + '" cy="' + Y(p.y) + '" r="' + (pts.length > 30 ? 1.8 : 3) + '" fill="' + col + '"/>'; });
  }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto">' + g + '</svg>';
}
function spark(vals, color) {
  if (vals.length < 2) return '';
  const W = 120, H = 40, mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  const d = vals.map((v, i) => (i ? 'L' : 'M') + ((i * W) / (vals.length - 1)).toFixed(1) + ' ' + (4 + (H - 8) * (1 - (v - mn) / ((mx - mn) || 1))).toFixed(1)).join(' ');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="spark" preserveAspectRatio="none"><path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>';
}
function barRow(label, v, max, color, unit) {
  const f = Math.min(100, (v / (max || 1)) * 100);
  return '<div class="macro"><div class="row between"><b>' + label + '</b><span class="muted">' + Math.round(v) + '/' + max + (unit || ' г') + '</span></div>' +
    '<div class="bar" style="margin-top:6px"><i style="width:' + f + '%;background:' + color + '"></i></div></div>';
}

// ---------- tabs
document.querySelectorAll('#tabs button').forEach((b) => b.onclick = () => {
  tab = b.dataset.t; haptic();
  document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b));
  window.scrollTo(0, 0); render();
});
function render() {
  if (!S) return;
  const v = $('view');
  v.innerHTML = tab === 'today' ? viewToday() : tab === 'diary' ? viewDiary() : tab === 'charts' ? viewCharts() : tab === 'gym' ? viewGym() : viewMore();
  bind();
}

// ---------- Сегодня
function viewToday() {
  const e = S.eaten, left = S.target - e.k, over = left < 0;
  const dn = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'][S.dow];
  const next = S.meals.find((m) => m.t >= S.min - 15);
  const lastW = S.weights.length ? S.weights[S.weights.length - 1].kg : null;
  const firstW = S.weights.length ? S.weights[0].kg : null;
  const st = S.steps.find((x) => x.d === S.date);
  const sl = S.sleep.find((x) => x.d === S.date);
  const glasses = Math.round(S.water.goal / 250);
  let gl = '';
  for (let i = 0; i < glasses; i++) { const f = Math.max(0, Math.min(1, (S.water.ml - i * 250) / 250)); gl += '<div class="glass"><i style="height:' + f * 100 + '%"></i></div>'; }
  return '' +
    '<div class="row between" style="margin:2px 6px 12px"><div><div class="mid">Привет' + (S.name ? ', ' + esc(S.name) : '') + ' 👋</div><div class="muted">' + dn + ', ' + ddmm(S.date) + (S.holiday ? ' · ' + S.holiday : '') + '</div></div>' +
    '<div class="chip" style="cursor:default">🔥 ' + S.streak + ' дн.</div></div>' +
    '<div class="card"><div class="row" style="gap:16px">' +
      '<div class="ringwrap">' + ring(e.k, S.target, over ? 'var(--warn)' : 'var(--good)') +
        '<div class="center"><div class="big">' + e.k + '</div><div class="muted">из ' + S.target + ' ккал</div><div style="margin-top:4px;font-weight:650;color:' + (over ? 'var(--warn)' : 'var(--good)') + '">' + (over ? '+' + (-left) + ' сверху' : 'осталось ' + left) + '</div></div></div>' +
      '<div style="flex:1;display:flex;flex-direction:column;gap:12px;min-width:0">' +
        barRow('Белки', e.p, S.macros.p, 'var(--p)') + barRow('Жиры', e.f, S.macros.f, 'var(--f)') + barRow('Углев.', e.c, S.macros.c, 'var(--c)') +
      '</div></div>' +
      '<div class="row" style="margin-top:14px;gap:8px"><button class="btn" data-go="diary">＋ Записать еду</button></div>' +
    '</div>' +
    (S.smart && e.k > 0 ? '<div class="card"><div class="muted" style="margin-bottom:6px">Что съесть дальше</div><div style="white-space:pre-line;font-size:14px">' + esc(S.smart) + '</div></div>' : '') +
    '<div class="card"><div class="row between"><b>💧 Вода</b><span class="muted">' + n1(S.water.ml / 1000) + ' из ' + n1(S.water.goal / 1000) + ' л</span></div>' +
      '<div class="glasses">' + gl + '</div>' +
      '<div class="row" style="gap:8px"><button class="chip" data-water="250">+250 мл</button><button class="chip" data-water="500">+500 мл</button><button class="chip" data-water="-250" style="margin-left:auto">−250</button></div></div>' +
    '<div class="row" style="gap:10px;align-items:stretch">' +
      '<div class="card" style="flex:1;margin:0" data-act="weight"><div class="muted">⚖️ Вес</div><div class="mid" style="margin:4px 0">' + (lastW ? n1(lastW) + ' кг' : '—') + '</div>' +
        '<div class="muted">' + (lastW && S.weights.length > 1 ? (lastW - firstW <= 0 ? '' : '+') + n1(lastW - firstW) + ' кг с начала' : 'нажми, чтобы записать') + '</div>' + spark(S.weights.slice(-12).map((w) => w.kg), 'var(--accent)') + '</div>' +
      '<div class="card" style="flex:1;margin:0" data-act="steps"><div class="muted">👣 Шаги</div><div class="mid" style="margin:4px 0">' + (st ? st.n.toLocaleString('ru') : '—') + '</div>' +
        '<div class="muted">' + (S.act && S.act.avg ? 'в среднем ' + S.act.avg.toLocaleString('ru') : 'нажми, чтобы записать') + '</div>' + spark(S.steps.slice(-12).map((x) => x.n), 'var(--good)') + '</div>' +
    '</div>' +
    (sl ? '' : '<div class="card" style="margin-top:10px"><b>😴 Как спалось?</b><div class="row" style="gap:8px;margin-top:10px"><button class="chip" data-sleep="2">😃 Выспался</button><button class="chip" data-sleep="1">😐 Так себе</button><button class="chip" data-sleep="0">😫 Плохо</button></div></div>') +
    '<h2>План еды</h2><div class="card list">' + (S.meals.length ? S.meals.map((m) => '<div class="it" style="cursor:default"><span class="t' + (next && m.t === next.t ? ' next' : '') + '">' + fmt(m.t) + '</span><span class="n' + (next && m.t === next.t ? ' next' : '') + '">' + esc(m.n) + '</span></div>').join('') : '<div class="empty">Нет приёмов пищи</div>') + '</div>';
}

// ---------- Дневник
function foodResults(q) {
  const out = [];
  const nq = normq(q);
  (S.myFoods || []).forEach((m) => { if (!nq || normq(m.n).includes(nq)) out.push({ kind: 'mine', key: m.key, n: m.n, sub: m.k + ' ккал / порция', tag: '⭐ моё' }); });

}

function gramsSheet(title, sub, base, chips, unit, onOk, extraBtn) {
  openSheet('<div class="mid">' + esc(title) + '</div><div class="muted" style="margin:4px 0 14px">' + esc(sub) + '</div>' +
    '<div class="row wrap" style="gap:8px;margin-bottom:12px">' + chips.map((c) => '<button class="chip" data-g="' + c + '">' + c + ' ' + unit + '</button>').join('') + '</div>' +
    '<div class="stepper"><button data-d="-1">−</button><input id="gval" inputmode="decimal" value="' + base + '"><small>' + unit + '</small><button data-d="1">+</button></div>' +
    '<div class="muted" id="gprev" style="margin:10px 2px"></div>' +
    '<button class="btn" id="gok">Готово</button>' + (extraBtn || ''), (sh) => {
      const inp = sh.querySelector('#gval');
      const upd = () => { sh.querySelector('#gprev').innerHTML = onOk(parseFloat(String(inp.value).replace(',', '.')) || 0, true); };
      const stepv = unit === 'порц.' ? 0.5 : 10;
      sh.querySelectorAll('[data-g]').forEach((b) => b.onclick = () => { inp.value = b.dataset.g; upd(); haptic(); });
      sh.querySelectorAll('[data-d]').forEach((b) => b.onclick = () => { inp.value = Math.max(0, (parseFloat(String(inp.value).replace(',', '.')) || 0) + stepv * +b.dataset.d); upd(); haptic(); });
      inp.oninput = upd; upd();
      sh.querySelector('#gok').onclick = () => { const g = parseFloat(String(inp.value).replace(',', '.')); if (g > 0) { closeSheet(); onOk(g, false); } };
    });
}
function macroLine(k, p, f, c) { return '<b>' + Math.round(k) + ' ккал</b> · Б ' + Math.round(p) + ' · Ж ' + Math.round(f) + ' · У ' + Math.round(c); }
function addFromResult(r) {
  if (r.kind === 'food') {
    const f = S.foods[r.i], unit = f.ml ? 'мл' : 'г';
    const chips = f.pc ? [f.pc, f.pc * 2, f.pc * 3] : [100, 150, 200, 250, 300];
    gramsSheet(f.n, f.k + ' ккал на 100 ' + unit + (f.pc ? ' · 1 шт ≈ ' + f.pc + ' ' + unit : ''), f.d || f.pc || 100, chips, unit, (g, prev) => {
      const x = g / 100;
      if (prev) return macroLine(f.k * x, f.p * x, f.f * x, f.c * x);
      api('add', { fi: r.i, g: g }).then(okHaptic);
    });
  } else if (r.kind === 'mine') {
    const m = S.myFoods.find((x) => x.key === r.key);
    gramsSheet(m.n, m.k + ' ккал за порцию', 1, [0.5, 1, 1.5, 2], 'порц.', (c, prev) => prev ? macroLine(m.k * c, m.p * c, m.f * c, m.c * c) : api('add', { mine: m.key, cnt: c }).then(okHaptic));
  } else {
    const rc = S.recent[r.i];
    gramsSheet(rc.name, 'как в прошлый раз: ' + rc.g + ' ' + rc.u, rc.g, [rc.g], rc.u, (g, prev) => { const f = g / rc.g; return prev ? macroLine(rc.k * f, rc.p * f, rc.fat * f, rc.c * f) : api('add', { recent: r.i, g: g }).then(okHaptic); });
  }
}
function itemSheet(x) {
  if (!x.g) {
    openSheet('<div class="mid">' + esc(x.name) + '</div><div class="muted" style="margin:6px 0 14px">' + x.k + ' ккал · записано в ' + fmt(x.at) + '</div><button class="btn danger" id="del">Удалить</button>', (sh) => {
      sh.querySelector('#del').onclick = () => { closeSheet(); api('del', { i: x.i }); };
    });
    return;
  }
  const per = x.k / x.g, pp = x.p / x.g, pf = x.f / x.g, pc = x.c / x.g;
  gramsSheet(x.name, 'записано в ' + fmt(x.at) + ' · поменяй количество', x.g, [], x.u, (g, prev) => prev ? macroLine(per * g, pp * g, pf * g, pc * g) : api('edit', { i: x.i, g: g }),
    '<button class="btn danger" id="del" style="margin-top:8px">Удалить</button>');
  $('sheet').querySelector('#del').onclick = () => { closeSheet(); api('del', { i: x.i }); };
}

function viewCharts() {

  if (chartTab === 'weight') {
    const w = S.weights;
    const rate = w.length > 1 ? ((w[w.length - 1].kg - w[0].kg) / Math.max(1, (Date.parse(w[w.length - 1].d) - Date.parse(w[0].d)) / 604800000)) : null;

      '<div style="text-align:right"><div class="muted">С начала</div><div class="mid">' + (w.length > 1 ? n1(w[w.length - 1].kg - w[0].kg) + ' кг' : '—') + '</div>' + (rate != null ? '<div class="muted">' + n1(rate) + ' кг/нед</div>' : '') + '</div></div>' +

      lineChart(d.map((x) => ({ x: ddmm(x.d), y: pr ? x.p : x.k, today: x.today })), { bars: true, zero: true, target: pr ? 150 : S.target, color: pr ? 'var(--p)' : 'var(--accent)' }) +
      '<div class="muted">Пунктир — цель. ' + (pr ? '' : 'Оранжевые — заметно больше нормы, серые — заметно меньше.') + '</div></div>';
  } else if (chartTab === 'lift') {
    const L = S.lifts;
    if (!L.length) body = '<div class="card empty">Запиши подходы во вкладке «Зал» — тут появится график силы 💪</div>';
    else {
      if (!liftKey || !L.find((x) => x.key === liftKey)) liftKey = L[0].key;
      const cur = L.find((x) => x.key === liftKey);

        '<div class="card"><div class="mid">' + esc(cur.n) + '</div><div class="muted">' + (cur.bw ? 'лучший подход, повторы' : 'рабочий вес, кг') + '</div>' + lineChart(cur.hist.map((x) => ({ x: ddmm(x.d), y: x.v })), { color: 'var(--p)' }) + '</div>';
    }
  } else if (chartTab === 'waist') {
    body = '<div class="card">' + lineChart(S.waist.map((x) => ({ x: ddmm(x.d), y: x.cm })), { color: 'var(--c)' }) + '<button class="btn ghost" style="margin-top:10px" data-act="waist">Записать талию</button></div>';
  } else if (chartTab === 'water') {

  }
  return '<div class="seg">' + tabs.map((t) => '<button data-chart="' + t[0] + '" class="' + (t[0] === chartTab ? 'on' : '') + '">' + t[1] + '</button>').join('') + '</div>' + body;
}

let timerH = null;
function startTimer(sec) {
  const el = $('timer'), total = sec;
  el.classList.add('show');
  const tick = () => {
    $('timerRing').innerHTML = '<div class="ringwrap">' + ring(total - sec, total, 'var(--accent)') + '<div class="center"><div class="big">' + Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0') + '</div></div></div>';
    if (sec <= 0) { stopTimer(); okHaptic(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} toast('Отдых окончен — следующий подход 💪'); return; }
    sec--;
  };
  clearInterval(timerH); tick(); timerH = setInterval(tick, 1000);
}

// ---------- bind events
function bind() {
  const v = $('view');
  v.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => { document.querySelector('#tabs [data-t="' + b.dataset.go + '"]').click(); setTimeout(() => { const q = $('q'); if (q) q.focus(); }, 50); });
  v.querySelectorAll('[data-water]').forEach((b) => b.onclick = () => { haptic(); api('water', { ml: +b.dataset.water }); });
  v.querySelectorAll('[data-sleep]').forEach((b) => b.onclick = () => { haptic(); api('sleep', { q: +b.dataset.sleep }); });
  v.querySelectorAll('[data-chart]').forEach((b) => b.onclick = () => { chartTab = b.dataset.chart; haptic(); render(); });
  v.querySelectorAll('[data-lift]').forEach((b) => b.onclick = () => { liftKey = b.dataset.lift; haptic(); render(); });
  v.querySelectorAll('[data-item]').forEach((b) => b.onclick = () => itemSheet(S.items.find((x) => x.i === +b.dataset.item)));
  v.querySelectorAll('[data-remind]').forEach((b) => b.onclick = () => { haptic(); api('remind', { g: b.dataset.remind }); });
  v.querySelectorAll('[data-unset]').forEach((b) => b.onclick = () => { haptic('medium'); api('unset', { key: b.dataset.unset }); });
  v.querySelectorAll('[data-st]').forEach((b) => b.onclick = () => {
    const [k, f, d] = b.dataset.st.split('|'), e = S.workout.list.find((x) => x.key === k);
    const step = f === 'w' ? (e.step || 2.5) : 1;
    inputs[k][f] = Math.max(0, Math.round(((+inputs[k][f] || 0) + step * +d) * 10) / 10);
    v.querySelector('[data-in="' + k + '|' + f + '"]').value = inputs[k][f]; haptic();
  });
  v.querySelectorAll('[data-in]').forEach((i) => i.oninput = () => { const [k, f] = i.dataset.in.split('|'); inputs[k][f] = parseFloat(String(i.value).replace(',', '.')) || 0; });
  v.querySelectorAll('[data-set]').forEach((b) => b.onclick = async () => {
    const k = b.dataset.set;
    b.disabled = true;
    const j = await api('set', { key: k, w: inputs[k].w || 0, r: inputs[k].r });
    if (j.ok && !j.msg) { okHaptic(); if (S.workout.timer) startTimer(S.workout.timerMin * 60); }
  });
  const q = $('q');
  if (q) {
    q.oninput = () => {
      search = q.value;
      const res = foodResults(search);
      $('results').innerHTML = res.map((r, k) => '<div class="res" data-res="' + k + '"><div><div>' + esc(r.n) + '</div><div class="tag">' + esc(r.sub) + (r.tag ? ' · ' + r.tag : '') + '</div></div><b style="color:var(--accent)">＋</b></div>').join('') + (search && !res.length ? '<div class="empty">Не нашёл. Опиши текстом ниже — разберу сам 🤖</div>' : '');
      bindRes(res);
    };
    bindRes(foodResults(search));
  }
  v.querySelectorAll('[data-act]').forEach((b) => b.onclick = () => act(b.dataset.act));
}
function bindRes(res) { document.querySelectorAll('[data-res]').forEach((b) => b.onclick = () => { haptic(); addFromResult(res[+b.dataset.res]); }); }
function numberSheet(title, val, unit, step, chips, cb) {
  openSheet('<div class="mid">' + title + '</div>' + (chips.length ? '<div class="row wrap" style="gap:8px;margin:14px 0">' + chips.map((c) => '<button class="chip" data-c="' + c + '">' + c + '</button>').join('') + '</div>' : '<div style="height:14px"></div>') +
    '<div class="stepper"><button data-d="-1">−</button><input id="nv" inputmode="decimal" value="' + val + '"><small>' + unit + '</small><button data-d="1">+</button></div><button class="btn" id="nok" style="margin-top:12px">Сохранить</button>', (sh) => {
    const inp = sh.querySelector('#nv');
    sh.querySelectorAll('[data-c]').forEach((b) => b.onclick = () => { inp.value = b.dataset.c; haptic(); });
    sh.querySelectorAll('[data-d]').forEach((b) => b.onclick = () => { inp.value = Math.round(((parseFloat(String(inp.value).replace(',', '.')) || 0) + step * +b.dataset.d) * 10) / 10; haptic(); });
    sh.querySelector('#nok').onclick = () => { const x = parseFloat(String(inp.value).replace(',', '.')); if (x >= 0) { closeSheet(); cb(x); } };
  });
}
function act(a) {
  if (a === 'weight') {
    const lw = S.weights.length ? S.weights[S.weights.length - 1].kg : S.startWeight;
    numberSheet('⚖️ Вес утром натощак', lw, 'кг', 0.1, [], (x) => api('weight', { kg: x }).then(okHaptic));
  } else if (a === 'waist') numberSheet('📏 Талия на уровне пупка', S.waist.length ? S.waist[S.waist.length - 1].cm : 100, 'см', 0.5, [], (x) => api('waist', { cm: x }).then(okHaptic));
  else if (a === 'steps') { const st = S.steps.find((x) => x.d === S.date); numberSheet('👣 Шаги за сегодня', st ? st.n : 10000, 'шагов', 500, [5000, 8000, 11000, 14000], (x) => api('steps', { n: Math.round(x) }).then(okHaptic)); }
  else if (a === 'freetext') { const t = $('freetext').value.trim(); if (t) { toast('Считаю…'); api('add', { text: t }).then((j) => { if (j.ok && !j.msg) okHaptic(); }); } }
  else if (a === 'note') { const t = $('note').value.trim(); if (t) api('note', { t: t }).then(() => toast('Записал')); }
  else if (a === 'quiet') api('quiet', { from: $('qf').value, to: $('qt').value }).then(() => toast(S.settings.quiet ? 'Тихие часы сохранены' : 'Тихие часы выключены'));
  else if (a === 'export') api('export');
  else if (a === 'timer') {
    openSheet('<div class="mid">⏱ Отдых между подходами</div><div class="row wrap" style="gap:8px;margin-top:14px">' + [0, 1, 1.5, 2, 3, 4, 5].filter((x) => x === Math.round(x) || false).map((n) => '<button class="chip' + ((S.workout.timer ? S.workout.timerMin : 0) === n ? ' on' : '') + '" data-tm="' + n + '">' + (n ? n + ' мин' : 'выкл') + '</button>').join('') + '</div>', (sh) => {
      sh.querySelectorAll('[data-tm]').forEach((b) => b.onclick = () => { closeSheet(); api('timer', { n: +b.dataset.tm }); });
    });
  }
}

if (!initData) showError('auth'); else api('state');
</script>
</body>
</html>
